<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- minimum-scale under 1 is what lets a pinch go below the default zoom; no
     maximum-scale so zooming in keeps the browser's own generous ceiling. -->
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=0.2">
<title>PoolRadar &mdash; Bracket Graph</title>
<style>
* { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; font-size: 14px; }
a { color: #60a5fa; text-decoration: none; }
a:hover { text-decoration: underline; }

.header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #1e293b; border-bottom: 1px solid #334155; flex-wrap: wrap; }
.header h1 { margin: 0; font-size: 18px; color: #f8fafc; flex-shrink: 0; }
.header .sub { color: #64748b; font-size: 12px; }
.url-input { flex: 1; min-width: 180px; max-width: 420px; padding: 7px 12px; border: 1px solid #475569; border-radius: 6px; background: #0f172a; color: #e2e8f0; font-size: 14px; font-family: inherit; }

.toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: #1e293b; border-bottom: 1px solid #334155; flex-wrap: wrap; }
.toggle-btn { background: #0f172a; border: 1px solid #475569; color: #94a3b8; border-radius: 6px; padding: 5px 11px; cursor: pointer; font-size: 12px; font-family: inherit; }
.toggle-btn:hover { border-color: #64748b; color: #e2e8f0; }
.toggle-btn.active { background: #1d4ed8; border-color: #3b82f6; color: #f8fafc; }
.tb-group { display: flex; gap: 4px; align-items: center; }
.select-input { background: #0f172a; border: 1px solid #475569; color: #94a3b8; border-radius: 6px; padding: 5px 8px; font-size: 12px; font-family: inherit; cursor: pointer; }
.select-input:hover { border-color: #64748b; color: #e2e8f0; }
.select-input.filtered { border-color: #3b82f6; color: #dbeafe; }
.tb-label { color: #64748b; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-right: 2px; }
.spacer { flex: 1; }
.refresh { color: #64748b; font-size: 12px; margin-left: 10px; flex-shrink: 0; }
/* .tb-group sets display, which would otherwise beat the UA rule for [hidden] */
[hidden] { display: none !important; }

/* Floating search, as index.html does it. The page itself is the scroll
   container for the bracket, so anything in the toolbar is gone the moment you
   pan into the diagram — which is exactly when you want to look someone up. */
.gs-fab { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom));
  width: 48px; height: 48px; border-radius: 50%; background: #2563eb; border: none; color: #fff;
  display: none; align-items: center; justify-content: center; cursor: pointer; z-index: 998;
  box-shadow: 0 4px 14px rgba(0,0,0,0.5); -webkit-tap-highlight-color: transparent; }
.gs-fab.visible { display: flex; }
.gs-fab:hover { background: #3b82f6; }
.gs-fab svg { width: 21px; height: 21px; }
/* Stacked above the magnifier, and only while something is lit. */
.gs-clear { position: fixed; right: 26px; bottom: calc(78px + env(safe-area-inset-bottom));
  width: 36px; height: 36px; border-radius: 50%; background: #1e293b; border: 1px solid #475569;
  color: #cbd5e1; font-size: 20px; line-height: 1; display: flex; align-items: center;
  justify-content: center; cursor: pointer; z-index: 998; box-shadow: 0 3px 10px rgba(0,0,0,0.45);
  -webkit-tap-highlight-color: transparent; }
.gs-clear:hover { border-color: #60a5fa; color: #f8fafc; }

.gs-overlay { position: fixed; inset: 0; background: rgba(2,6,23,0.94); z-index: 1001; display: none;
  padding: max(12px, env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)); }
.gs-overlay.open { display: block; }
.gs-box { max-width: 520px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; }
.gs-bar { display: flex; align-items: center; gap: 8px; background: #1e293b; border: 1px solid #334155;
  border-radius: 10px; padding: 6px 10px; flex-shrink: 0; }
.pse-icon { width: 16px; height: 16px; color: #64748b; flex-shrink: 0; }
/* 16px keeps iOS Safari from zooming the page on focus */
#player-input { flex: 1; min-width: 0; background: none; border: none; outline: none; color: #e2e8f0;
  font-size: 16px; padding: 8px 0; font-family: inherit; }
.gs-close { background: none; border: none; color: #94a3b8; font-size: 26px; line-height: 1;
  cursor: pointer; padding: 0 4px; min-width: 32px; }
.gs-close:hover { color: #e2e8f0; }
.gs-hint { flex-shrink: 0; padding: 8px 12px 2px; color: #475569; font-size: 11px; }

.pse-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; margin-top: 6px; }
.pse-item { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 12px;
  border-radius: 8px; cursor: pointer; color: #e2e8f0; font-size: 15px; }
.pse-item.active, .pse-item:hover { background: #1e293b; }
.pse-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pse-name mark { background: none; color: #60a5fa; font-weight: 700; }
/* Monospace so the runs line up down the list and are scannable as a column */
.pse-meta { margin-left: auto; padding-left: 10px; flex-shrink: 0; white-space: nowrap;
  font: 12px/1 'SF Mono', Menlo, Consolas, monospace; letter-spacing: 1px; }
.pse-meta .fw { color: #4ade80; }
.pse-meta .fl { color: #f87171; }
.pse-empty { padding: 18px 12px; text-align: center; color: #64748b; font-size: 14px; }
/* Country rows lead the list and stand apart from the names under them. */
.pse-section { padding: 12px 12px 4px; color: #475569; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
.pse-item.pse-country .pse-name { font-weight: 600; }
.pse-item.pse-country .pse-flag { font-size: 23.4px; line-height: 1; margin-right: 0; }
.pse-item.pse-country .pse-meta { font-family: inherit; letter-spacing: 0; color: #64748b; font-size: 12px; }
.pse-chevron { color: #475569; font-size: 13px; padding-left: 6px; }

/* Row gap smaller than the column gap: two lines of legend should read as one
   block, and a full 14px between them looks like two separate bars. */
.legend { display: flex; gap: 6px 14px; padding: 8px 16px; background: #0f172a; border-bottom: 1px solid #334155; font-size: 11px; color: #64748b; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend kbd { font: 10px/1 'SF Mono', Menlo, Consolas, monospace; color: #94a3b8;
  border: 1px solid #334155; border-radius: 3px; padding: 2px 4px; }
.swatch { width: 11px; height: 11px; border-radius: 3px; border: 1px solid; display: inline-block; }
.lg-drop { color: #64748b; font-size: 10px; }
.lg-live { border-color: #ec4899; }
.lg-next { border-color: #4ade80; }
/* Forces the wrap rather than leaving it to whatever width the window happens
   to be: what you can click comes first, what a colour means comes after. */
.lg-break { flex-basis: 100%; height: 0; margin: 0; }

#status { padding: 12px 16px; font-size: 13px; color: #94a3b8; }
#status.error { color: #fca5a5; }
.spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid #334155; border-top-color: #60a5fa; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* The graph overflows the page rather than sitting in its own scroll box: a
   device-width scroll container would clip at the same place however far you
   pinched out, so zooming out would shrink everything and reveal nothing.
   touch-action gives up pinch over the diagram so the handler below can take
   it — the page's own zoom is still there over the bars. */
#viewport { padding: 16px; touch-action: pan-x pan-y; }
/* #zoom carries the scaled footprint. A transform does not change layout size,
   so without a box sized to match, a zoomed-in diagram would have nothing to
   scroll to and a zoomed-out one would leave its old area behind as blank. */
#zoom { position: relative; }
#graph { display: inline-block; transform-origin: 0 0; }
/* Full-bleed bars, so they still span when scrolled right past device width */
.header, .toolbar, .legend, #status { min-width: max-content; }
#graph svg { max-width: none !important; }
/* Mermaid renders labels as HTML in a foreignObject, so the tags inside a node
   label are stylable from here: <b> the match winner, <i> a slot still waiting
   on a feeder, <small> the loser's drop destination. classDef sets colour on
   the label, hence !important.

   COLOUR ONLY. Mermaid measures a label in a container of its own before the
   SVG is ever inserted here, so a rule under #graph is not in effect while it
   decides how big the box is. Anything that changes a label's SIZE has to be
   unscoped — see the block below — or every node is measured for one layout and
   painted with another, and the difference shows as slack along the bottom and
   right edges, which is where an oversized box leaves its unused room. */
#graph b { color: #fbbf24 !important; }
#graph i { color: #64748b !important; }
#graph small { color: #64748b !important; }
/* classDef puts an !important colour on the label, so this needs one too, and
   the extra g.node keeps it ahead of anything Mermaid injects into the SVG —
   that stylesheet sits inside #graph, so it wins ties on document order.
   A lighter blue than the app's usual #60a5fa on purpose: at 7px, next to
   #cbd5e1 text, a blue darker than its neighbours reads as grey. */
#graph g.node .nd-tbl, #graph g.node .nt-tbl { color: #38bdf8 !important; }
#graph g.node .nt-rt { color: #94a3b8 !important; }
/* The scheduled time is the same blue turned down, and it used to get there
   with opacity: 0.75. Not on iOS Safari it did not. An element with an opacity
   below 1 gets its own stacking context, and WebKit composites a stacking
   context inside a foreignObject against the SVG root rather than against the
   box it actually lives in — so every "1:00pm" left its node and stacked up in
   the top-left corner of the diagram. Only these, because they are the only
   thing in a label that ever asked for opacity; the table on the same row,
   placed by the same rule, stayed where it was put.
   #38bdf8 at 75% over the node fill is #3298c9, so this is the same colour by
   another route, and it composites like ordinary text. The extra class beats
   the !important above it on specificity. */
#graph g.node .nd-tbl.tbl-when, #graph g.node .nt-tbl.tbl-when {
  color: #3298c9 !important; }

/* The metric half of the rules above, unscoped so they apply while measuring.
   Keyed off our own classes rather than Mermaid's, so they do not depend on
   what its wrapper happens to be called. */
.pn1 b, .pn2 b { font-weight: 400; }
/* relative, so it tracks themeVariables.fontSize instead of fighting it */
.nd-drop { font-size: 0.85em; }

/* Nationality beside a name. Windows ships no regional-indicator glyphs at all
   and iOS suppresses this one in some regions, so tw comes from the same
   inlined art index.html uses rather than the emoji.
   .pf is the dropdown's size, .nf the diagram's — one fixed, one em-relative so
   it tracks themeVariables.fontSize. Two classes rather than one class and an
   override, because the override could only have been scoped. */
.pf { margin-right: 4px; font-size: 14.3px; line-height: 1; vertical-align: -0.06em; }
.nf { margin-right: 3px; font-size: 1.15em; line-height: 1; vertical-align: -0.06em; }
.flag-img { display: inline-block; background-position: center; background-size: contain;
  background-repeat: no-repeat; width: 1.36em; height: 0.91em; vertical-align: -0.08em; }
.nf.flag-img { vertical-align: -0.08em; }

/* Flowing left to right a match is laid out in three columns — number,
   players, scores — so the box is two rows tall rather than the three or four
   the stacked form needs. The loser's destination stacks under the number
   inside the same cell, spending width, which is the cheap direction here.
   Unscoped on purpose: Mermaid measures a label in a detached container of its
   own, so a rule under #graph would not apply while it decides how big the
   node is, and every box would come out the wrong size. */
/* inline-grid, top-aligned: Mermaid drops the label into a table-cell with
   line-height 1.5, and a block-level grid in there leaves that line box behind
   as an empty band under the last row, inside the node's border. Every cell is
   placed by hand and the rows are declared, so no implicit third row can be
   created either. */
.nd { display: inline-grid; vertical-align: top;
  grid-template-columns: auto auto auto; grid-template-rows: auto auto;
  align-items: center; column-gap: 0; row-gap: 0; text-align: left; line-height: 1.25; }
/* The number column centres its own text — match number, table, drop — rather
   than inheriting the left alignment the names use. No padding-right: the grid's
   column-gap already separates it, and asymmetric padding would throw the
   centring off by half of it. */
.nd-h { grid-column: 1; grid-row: 1 / span 2; display: flex; flex-direction: column;
  justify-content: center; text-align: center; }
.nd-id { white-space: nowrap; }
/* The gutters are padding on the cells rather than the grid's column-gap, so
   the score column can give its own back when there is no score to show —
   a gap charges for a track whether or not anything is in it, and every
   undecided match would carry a dead strip down its right-hand edge. */
.nd-p { grid-column: 2; white-space: nowrap; padding-left: 5px; }
.nd-s { grid-column: 3; text-align: right; white-space: nowrap; padding-left: 5px; }
.nd-s:empty { padding-left: 0; }
.nd-r1 { grid-row: 1; }
.nd-r2 { grid-row: 2; }

/* Flowing top to bottom the box stays tall and narrow, so the match number and
   the drop keep their own full-width rows and only the score is pulled out into
   a column of its own — which is all it takes to line the scores up down the
   node instead of letting each one float off the end of its name. */
/* Flowing bottom to top the box is narrow and tall, so each fact takes a line
   of its own: the number, the table or the time, a name, its rating, the score
   between the two players, the other name, its rating, the drop. The box is
   then as wide as the longest single name rather than as a name plus a score
   sitting beside it.
   One column in document order, so nothing is placed by hand and a row that is
   not there simply does not appear — which is what the old grid needed a whole
   second set of rules to fake whenever a table row pushed everything down. */
.nt { display: inline-grid; vertical-align: top; grid-template-columns: auto;
  justify-items: center; row-gap: 0; line-height: 1.25; text-align: center; }
.nt-id { text-align: center; }
.nt-p { white-space: nowrap; }
/* A rating is a footnote to the name above it, not part of it. */
.nt-rt { display: block; font-size: 0.85em; }
.nt-sc { white-space: nowrap; }
.nt-drop { text-align: center; }
/* The table a match is being played on, under its number. In the stacked flow
   that is a row of its own, which pushes everything below it down one. */
.nd-tbl, .nt-tbl { font-size: 0.9em; font-weight: 600; }
/* A scheduled start sits in the table's row but reads as the quieter of the
   two: a table is where to go now, a time is only a plan. Lighter and smaller
   so it does not out-shout the match number it hangs under, and nowrap because
   "Sun 10:00am" breaking in half would make the node two rows taller.
   The "lighter" is a colour rather than an opacity — see the note beside it in
   the #graph block, which is where it had to move to. */
.nd-tbl.tbl-when, .nt-tbl.tbl-when {
  font-size: 0.8em; font-weight: 400; white-space: nowrap; }
.nt-tbl { text-align: center; }
/* Mermaid wraps the label in a <p>, whose default block margin would band the
   node top and bottom. Harmless for the stacked flow, which wants none either. */
.nodeLabel p { margin: 0; }

/* Every node's look comes from here now, not from a Mermaid classDef. classDef
   writes its properties onto the shape inline and !important, which nothing can
   override afterwards — and being able to override afterwards is exactly what
   turns a selection from a two-second relayout into a class change. */
#graph g.node > rect { fill: #1e293b !important; stroke: #475569 !important; }
#graph .nodeLabel { color: #cbd5e1 !important; }
/* a match under way */
#graph g.node.is-live > rect { stroke: #ec4899 !important; }
/* selected */
#graph g.node.is-hi > rect {
  fill: #1e3a5f !important; stroke: #60a5fa !important; stroke-width: 2px !important; }
#graph g.node.is-hi .nodeLabel { color: #e2e8f0 !important; }
#graph g.node.is-hi.is-live > rect { stroke: #ec4899 !important; }
/* The far end of a waiting route: both players known, nothing left to wait for,
   so these are the matches that actually have to be played next. Green rather
   than the route's blue because they are the answer and the route is only the
   question, and overridden by is-live below because a match already under way
   is the more urgent fact about it. */
#graph g.node.is-next > rect { stroke: #4ade80 !important; stroke-width: 2.5px !important; }
#graph g.node.is-next.is-live > rect { stroke: #ec4899 !important; }
/* Inside a lit node every winner's gold is muted back, and the rule injected
   for the selection puts it back on just their names — so a selected player and
   the opponent who beat them can never read the same. */
#graph g.node.is-hi b { color: #cbd5e1 !important; }
/* Edges. is-faint dims everything that is not part of a run; is-run is the run
   itself; is-added is a step Mermaid never drew, which we draw ourselves. */
#graph path.is-faint { stroke: #1e293b !important; stroke-width: 1px !important; }
#graph path.is-run { stroke: #60a5fa !important; stroke-width: 3px !important; }
/* A step we drew ourselves. fill:none belongs to Mermaid's .flowchart-link,
   which the clone inherits — this is the belt to that braces. */
#graph path.is-added { fill: none !important; }
#graph .pn1, #graph .pn2 { cursor: pointer; }
#graph .pn1:hover, #graph .pn2:hover { text-decoration: underline; }
/* The number column is the match itself rather than either player in it, which
   is what makes it the thing to click to ask what the match is waiting on. A
   bigger and less ambiguous target than the number alone — flowing left to
   right it is the whole left-hand edge of the box — and an empty slot answers
   the same question from where the reader is already looking anyway.
   Colour and underline only: a rule in here cannot change a label's size, or
   Mermaid would have measured the box before it applied. */
#graph .nd-h, #graph .nt-id, #graph .pnd { cursor: pointer; }
#graph .nd-h:hover .nd-id, #graph .nt-id:hover,
#graph .pnd:hover { text-decoration: underline; color: #94a3b8 !important; }

@media (max-width: 768px) {
  .header h1 { font-size: 16px; }
  .url-input { max-width: none; flex-basis: 100%; }
}
</style>
</head>
<body>

<div class="header">
  <h1>Bracket Graph</h1>
  <input class="url-input" id="slug-input" placeholder="digitalpool.com or wntlivescores.com URL">
  <button class="toggle-btn" id="load-btn">Load</button>
  <span class="spacer"></span>
  <a id="back-link" href="index.html">&larr; PoolRadar</a>
</div>

<div class="toolbar">
  <span class="tb-group" id="stage-group" hidden><span class="tb-label">Stage</span>
    <select class="select-input" id="stage-sel"></select>
  </span>
  <span class="tb-group" id="from-group"><span class="tb-label">From</span>
    <select class="select-input" id="round-from"><option value="0">All stages</option></select>
  </span>
  <span class="tb-group"><span class="tb-label">Flow</span>
    <button class="toggle-btn" data-dir="BT">&uarr;</button>
    <button class="toggle-btn" data-dir="LR">&rarr;</button>
  </span>
  <span class="spacer"></span>
  <span class="sub" id="counts"></span>
  <button class="toggle-btn" id="zoom-reset" hidden title="Back to 100%">100%</button>
  <span class="refresh" id="refresh" hidden>&#8635; <span id="countdown">60</span>s</span>
</div>

<div class="legend">
  <span>click a name to highlight that player &middot; click again to clear</span>
  <span>click a match number or a <i class="lg-drop">TBD</i> to trace what it is waiting on</span>
  <span class="lg-break"></span>
  <span>press <kbd>/</kbd> or the magnifier to find a player by name or by country</span>
  <span><i class="swatch lg-next"></i> ready to play</span>
  <span><i class="swatch lg-live"></i> match in progress</span>
</div>

<div id="status"></div>
<style id="sel-style"></style>
<div id="viewport"><div id="zoom"><div id="graph"></div></div></div>

<button class="gs-fab" id="search-fab" aria-label="Find a player or a country" title="Find a player or a country (/)">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.7-4.7"/></svg>
</button>
<button class="gs-clear" id="search-clear" hidden aria-label="Clear the highlight">&times;</button>

<div class="gs-overlay" id="search-overlay" role="dialog" aria-modal="true" aria-label="Find a player or a country">
  <div class="gs-box">
    <div class="gs-bar">
      <svg class="pse-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.7-4.7"/></svg>
      <input type="text" id="player-input" placeholder="Player or country…" autocomplete="off"
             autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go"
             aria-label="Player or country" aria-autocomplete="list" aria-controls="player-list">
      <button class="gs-close" id="search-close" aria-label="Close search">&times;</button>
    </div>
    <div class="gs-hint" id="search-hint" hidden></div>
    <div class="pse-list" id="player-list" role="listbox"></div>
  </div>
</div>

<!-- The draw, indexed both ways, shared with index.html rather than written
     again here: its followTo() and this page's hop() were the same eight lines
     twice over, and its blockers table and this page's feeder map were the same
     map built twice. A classic script rather than a module, because index.html
     and test_blockers.html load it with a plain tag and jsc runs it alongside
     the unit tests — and a classic script is specified to run before any
     module, so its globals are already there when the one below starts. -->
<script src="bracket-algo.js"></script>
<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

const GQL = 'https://api-cached.digitalpool.com/';

// The same proxy index.html reads: wntlivescores.com is login-only, so every
// read goes through a Worker holding the session. Served locally by
// wnt-dev-proxy.py, which also serves this page.
const WNT_PROXY_REMOTE = 'https://wnt-proxy.slyfox3.workers.dev';
const WNT_PROXY = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? '/wnt' : WNT_PROXY_REMOTE + '/wnt';

mermaid.initialize({
  startOnLoad: false,
  theme: 'dark',
  // Node width is the measured label plus padding, and the label is measured
  // at this size — so halving it roughly halves the boxes. This sets how big a
  // box is when the diagram is laid out; the zoom below scales what was laid
  // out, and can go well under this without relaying anything.
  themeVariables: { fontSize: '10px' },
  securityLevel: 'strict',
  // A full double-elim bracket is ~126 nodes / ~250 edges, well past the defaults.
  maxTextSize: 500000,
  maxEdges: 2000,
  // useMaxWidth:false is the important one — left on, Mermaid emits a
  // responsive SVG that scales to the container, so the more rounds are shown
  // the smaller every box gets. Off, nodes keep a constant readable size and
  // the page scrolls instead.
  // Tight: nodeSpacing is the gutter between boxes in a rank, rankSpacing the
  // gap between ranks, padding the box's own inner margin around the label.
  flowchart: { curve: 'basis', nodeSpacing: 12, rankSpacing: 40, padding: 3, useMaxWidth: false },
});

const QUERY = `query($s:String!){
  tournaments(where:{slug:{_eq:$s}},limit:1){name status}
  tournament_brackets(where:{tournament:{slug:{_eq:$s}}},order_by:{match_number:asc}){
    match_number round identifier status is_bye
    challenger1{name skill_level} challenger2{name skill_level}
    challenger1_score challenger2_score
    challenger1_is_winner challenger2_is_winner
    winner_to_num loser_to_num table_name scheduled_time start_time
  }
}`;

const $ = (id) => document.getElementById(id);
const state = {
  // Left to right by default: a bracket is read along its rounds, and the
  // columns leave room for full names. Except on a phone, which is tall and
  // narrow — the shape a stacked bracket wants and the opposite of what a
  // left-to-right one needs, where every round costs another screen of
  // sideways scrolling.
  dir: window.innerWidth <= 768 ? 'BT' : 'LR', fromStage: 0, player: null, waiting: null, rows: [], tournament: null,
  source: 'digitalpool', slug: '',
  // WNT only. One event JSON holds every stage and one stage is drawn at a
  // time, so the fetch is kept and switching stages is just a re-render.
  wntData: null, stage: 0,
  // What buildDiagram last produced, so a selection can be painted onto the SVG
  // on screen instead of asking for a new one. src is the source that SVG was
  // laid out from, kept so a refresh that changed nothing can recognise itself.
  diagram: null, src: null,
  // The draw indexed both ways, and the two rollups read off it. All four are
  // functions of the rows and nothing else, so setRows owns them and everything
  // downstream reads rather than rebuilds. keep is the one thing here that also
  // depends on the reader — the stage cut — so it is a cache, not a value.
  index: null, players: [], countries: [], playerBy: new Map(), keep: new Map(),
};

function setStatus(msg, isError) {
  const el = $('status');
  el.className = isError ? 'error' : '';
  el.innerHTML = msg;
}

async function gql(query, variables) {
  const res = await fetch(GQL, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ query, variables }),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if (json.errors) throw new Error(json.errors.map(e => e.message).join('; '));
  return json.data;
}

const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------------------------------------------------------------------------
// WNT Live Scores — second source
//
// wntlivescores.com describes a bracket with the same facts DigitalPool does,
// under other names: roundSide 1/2 for the two halves rather than the sign on
// the round, winnerDest/loserDest rather than winner_to_num/loser_to_num. So it
// is remapped onto the DigitalPool row shape and everything below — layout, the
// stage cut, player search, the edge rerouting — runs on it unchanged.
//
// The one structural difference is that a WNT event is split into stages, each
// its own bracket numbered from 1. The US Open's stage 1 is a 416-match double
// elimination whose 64 survivors seed stage 2, a 63-match single elimination.
// Those are two diagrams, picked between with the Stage control.
// ---------------------------------------------------------------------------

// 0 not started, 1 players called to the table, 2 under way, 3 done.
const WNT_STATUS = { 0: 'NOT_STARTED', 1: 'NOT_STARTED', 2: 'IN_PROGRESS', 3: 'COMPLETED' };

// WNT writes "2026-08-29 00:45:00", which is UTC but says neither that nor
// anything Date can parse on its own, as index.html corrects it.
function wntTime(s) { return s ? s.replace(' ', 'T') + 'Z' : null; }

// alpha-2 -> regional indicator pair, as index.html does it. WNT writes
// 'unknown' for the unaffiliated, which fails the shape test and drops out.
function wntFlag(code) {
  if (!code || !/^[a-z]{2}$/i.test(code)) return '';
  const cc = code.toUpperCase();
  return String.fromCodePoint(0x1F1E6 + cc.charCodeAt(0) - 65, 0x1F1E6 + cc.charCodeAt(1) - 65);
}

// WNT reports some countries under the name their federation competes as
// rather than the country's own, exactly as index.html corrects it.
const COUNTRY_NAME_OVERRIDE = { tw: 'Taiwan' };

// Codes drawn from inlined art rather than the regional-indicator emoji, and
// why — see the CSS above.
const FLAG_IMG = { tw: true };

// Attributes here are single-quoted, because the Mermaid label around them is
// delimited by double quotes. This string does not go through mmEsc, so the
// country name is reduced to plain text: an apostrophe would end the attribute
// and a '#' is Mermaid syntax even inside a quoted label.
function flagHtml(c) {
  if (!c || !c.country) return '';
  const cc = c.country;
  const label = String(c.countryName || cc).replace(/[^A-Za-z0-9 .-]/g, '').trim() || cc;
  if (FLAG_IMG[cc]) {
    return "<span class='nf flag-img flag-" + cc + "' role='img' aria-label='" + label + "'></span>";
  }
  const flag = wntFlag(cc);
  return flag ? "<span class='nf' role='img' aria-label='" + label + "'>" + flag + '</span>' : '';
}

function wntPlayer(p) {
  if (!p) return null;
  // nameReversed marks players written surname-first; the site swaps which
  // field holds which rather than reordering the output.
  const first = p.nameReversed ? p.surname : p.name;
  const last = p.nameReversed ? p.name : p.surname;
  const name = ((first || '') + (last ? ' ' + last : '')).trim();
  if (!name) return null;                     // an empty slot, same as no player
  const co = p.country || {};
  const cc = co.code ? String(co.code).toLowerCase() : null;
  return {
    name, skill_level: null, country: cc,
    countryName: cc ? (COUNTRY_NAME_OVERRIDE[cc] || co.name || cc) : (co.name || null),
  };
}

// Stages that actually have matches, in order. `reached` is the one that
// matters for picking a default: WNT publishes a later stage's whole schedule
// days before the event gets to it — the US Open's 63-match stage 2 existed
// three days before a ball was struck — so a stage only counts as reached once
// it holds a match with two players in it.
function wntStages(data) {
  return (((data || {}).stages) || []).map((s) => {
    const matches = (s.groups || []).reduce((a, g) => a.concat(g.matches || []), []);
    return {
      stage: s.stage,
      count: matches.length,
      reached: matches.some((m) => m.players && m.players[0] && m.players[1]),
    };
  }).filter((s) => s.count > 0);
}

// One stage, as DigitalPool-shaped rows.
function wntRows(data, stageNo) {
  const stage = (((data || {}).stages) || []).find((s) => s.stage === stageNo);
  if (!stage) return [];
  // Groups are flattened into one bracket, which assumes matchNumberInSchema is
  // unique across them. No published WNT event has ever put more than one group
  // in a stage, so there is nothing yet to key the numbers against.
  const raw = [];
  for (const g of stage.groups || []) for (const m of g.matches || []) raw.push(m);
  const here = new Set(raw.map((m) => m.matchNumberInSchema));
  // roundSide is the winners/losers half only where there are two of them. A
  // group stage reuses the field for its phases instead — Premier League Pool
  // runs three, of 15, 9 and 5 rounds — and folding side 3 into side 1 would
  // put matches from two phases that never met into one round.
  const sides = [...new Set(raw.map((m) => m.roundSide || 1))].sort((a, b) => a - b);
  const bracket = sides.every((s) => s === 1 || s === 2);
  // No losers half at all means a straight knockout, which changes how the
  // rounds are named and stops round 1 being treated as fan-out noise.
  const twoSided = bracket && sides.includes(2);
  // Phases get one round key each, in order, so nothing collides and the
  // diagram reads phase by phase. They name themselves, since "Winners R17"
  // would be a fiction — a group stage has no winners side and no seventeenth
  // round, only phase 2's second.
  const phase = new Map();
  if (!bracket) {
    [...new Set(raw.map((m) => (m.roundSide || 1) + ':' + (m.roundNumber || 1)))]
      .map((k) => k.split(':').map(Number))
      .sort((a, b) => a[0] - b[0] || a[1] - b[1])
      .forEach(([s, r], i) => phase.set(s + ':' + r, { round: i + 1, label: 'Phase ' + s + ' · R' + r }));
  }
  // A destination this stage does not contain is the way out of it: stage 1's
  // winners qualify into stage 2, which is a diagram of its own. loserDest 0
  // means eliminated, and is also how WNT marks a final. A group stage carries
  // no schemaData at all, so every destination comes back null.
  const dest = (n) => (n && here.has(n) ? n : null);

  return raw.map((m) => {
    const sd = m.schemaData || {};
    const rnd = m.roundNumber || 1;
    const ph = bracket ? null : phase.get((m.roundSide || 1) + ':' + rnd);
    const losers = bracket && m.roundSide === 2;
    const scores = m.scores || [];
    // Scores read 0-0 before play; only trust them once there is a result.
    const played = m.status >= 2 || scores[0] || scores[1];
    return {
      match_number: m.matchNumberInSchema,
      round: ph ? ph.round : (losers ? -rnd : rnd),
      round_label: ph ? ph.label : null,
      // DigitalPool ships an identifier like "W3-1"; WNT ships the parts.
      // A knockout has one side, so there its own match number reads better
      // and is what wntlivescores.com itself prints against the match.
      identifier: twoSided
        ? (losers ? 'L' : 'W') + rnd + '-' + (sd.positionInRound || '?')
        : '#' + m.matchNumberInSchema,
      status: WNT_STATUS[m.status] || 'NOT_STARTED',
      is_bye: false,
      challenger1: wntPlayer(m.players && m.players[0]),
      challenger2: wntPlayer(m.players && m.players[1]),
      challenger1_score: played ? scores[0] : null,
      challenger2_score: played ? scores[1] : null,
      challenger1_is_winner: m.winner === 1,
      challenger2_is_winner: m.winner === 2,
      winner_to_num: dest(sd.winnerDest),
      loser_to_num: dest(sd.loserDest),
      // table_preName is what WNT publishes before the match is called on.
      table_name: m.tableName || m.table_preName || null,
      // When it is due to start. TBA means the field carries a placeholder
      // rather than a plan, so it is dropped rather than printed.
      scheduled_time: m.dateScheduledTBA ? null : wntTime(m.dateScheduled),
      start_time: wntTime(m.dateStart),
      // Which of the destination's two slots this match fills, so an empty slot
      // names the feeder that is really going to fill it. DigitalPool does not
      // say, and there the slots are filled in the order the feeders came in.
      winner_to_pos: sd.winnerDestPositionInMatch || null,
      loser_to_pos: sd.loserDestPositionInMatch || null,
    };
  });
}

function fetchWnt(slug) {
  return fetch(WNT_PROXY + '/event/' + encodeURIComponent(slug))
    .then((r) => r.json().then((d) => {
      if (!r.ok) throw new Error(d.message || d.error || ('HTTP ' + r.status));
      return d;
    }));
}

// A knockout round is better named by how many are left in it than by its
// number — "Quarterfinals", not "Winners R4".
function knockoutName(n) {
  if (n === 1) return 'Final';
  if (n === 2) return 'Semifinals';
  if (n === 4) return 'Quarterfinals';
  return 'Last ' + n * 2;
}

function roundName(round, size, singleElim) {
  if (round === 0) return 'Unranked';
  if (singleElim && round > 0 && size > 0) return knockoutName(size);
  return round > 0 ? 'Winners R' + round : 'Losers R' + Math.abs(round);
}

// How wide each round is, over the whole bracket rather than the kept slice, so
// a round keeps its name when the stage cut is above it. Byes count: a bye is a
// slot in the round, and leaving them out turns a round of 16 that happens to
// be half byes into a "Quarterfinals".
function roundCounts(rows) {
  const out = new Map();
  for (const r of rows) {
    if (r.round == null) continue;
    out.set(r.round, (out.get(r.round) || 0) + 1);
  }
  return out;
}

// A round that names itself — a group-stage phase — overrides the derived name.
function roundLabels(rows) {
  const out = new Map();
  for (const r of rows) {
    if (r.round == null || !r.round_label || out.has(r.round)) continue;
    out.set(r.round, r.round_label);
  }
  return out;
}

// Mermaid treats these as syntax even inside a quoted label.
function mmEsc(s) {
  return String(s)
    .replace(/#/g, '#35;')
    .replace(/"/g, '#quot;')
    .replace(/[\[\]{}()<>|]/g, (c) => '#' + c.charCodeAt(0) + ';');
}

// "Table 5" and "5" both read as T5; anything that is not a plain number is
// left as the source wrote it, since it is a name rather than a number.
function tableLabel(name) {
  const s = String(name).replace(/^table\s*/i, '').trim();
  return /^[0-9]+[A-Za-z]?$/.test(s) ? 'T' + s : s;
}

// Hoisted because toLocaleTimeString and toLocaleDateString construct a fresh
// Intl.DateTimeFormat on every call, and constructing one is most of what
// formatting a date costs — the formatting itself is nearly free. Early in an
// event almost every match is still to come, so timeLabel runs for almost every
// node: at four hundred of them that measured thirty milliseconds a layout,
// which was more than the rest of building the source put together. Reusing
// three formatters takes it to nothing.
const FMT_TIME = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' });
const FMT_DAY = new Intl.DateTimeFormat(undefined, { weekday: 'short' });
const FMT_DATE = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric' });

// When a match that has not started yet is due, in the reader's own timezone
// and at the shortest length that stays unambiguous — "10:00am" today,
// "Sun 10:00am" within the week, "Aug 9 10:00am" beyond it. Same rule as
// index.html's matchTimeInfo, kept short because it goes inside a node.
function timeLabel(r) {
  const iso = r.scheduled_time || r.start_time;
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const time = FMT_TIME.format(d).replace(/\s*([AP])M$/i, (_, p) => p.toLowerCase() + 'm');
  const now = new Date();
  const days = Math.floor((d - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
  if (days === 0) return time;
  if (days > 0 && days < 7) return FMT_DAY.format(d) + ' ' + time;
  return FMT_DATE.format(d) + ' ' + time;
}

// pid gives each player a small stable number. It goes on their name spans so
// a selection can be painted by injecting one stylesheet rule instead of
// rebuilding the diagram — the label itself never mentions who is selected, and
// that is what keeps the whole source selection-independent.
function nodeLabel(r, idx, dropTo, wide, pid) {
  const decided = !!(r.challenger1_is_winner || r.challenger2_is_winner);
  // An empty slot is waiting on a specific match, so name it rather than
  // printing TBD twice. Feeders that already have a winner have delivered
  // their player, so only undecided ones can correspond to an empty slot.
  // The index stores the edge rather than the row it came from — it outlives
  // any one render and a held row would be a bracket behind after a refresh —
  // so the feeder is looked back up here.
  const pending = (idx.rev[r.match_number] || [])
    .map(f => ({ src: idx.byNum[f.num], kind: f.kind, pos: f.pos }))
    .filter(f => f.src && !f.src.p1Won && !f.src.p2Won);
  // WNT says which of the two slots a feeder is going to fill; DigitalPool does
  // not, so there they are consumed in the order they were collected. Taken
  // entries are nulled rather than spliced, so a positional take cannot shift
  // the index a later sequential one is about to read.
  let fi = 0;
  const takeFeeder = (slot) => {
    let at = pending.findIndex(f => f && f.pos === slot);
    if (at < 0) { while (fi < pending.length && !pending[fi]) fi++; at = fi; }
    const f = pending[at] || null;
    if (f) pending[at] = null;
    return f;
  };
  // slot is 1 or 2 — the wrapper is what lets a delegated click tell which of
  // the two players in a node was clicked. Name and score come back apart, so
  // the two flows can put them on one line or in two columns.
  const line = (c, score, won, slot) => {
    if (!c) {
      const f = takeFeeder(slot);
      // Clickable, because an empty slot is the one thing in a node worth
      // clicking when there is no name in it yet — it is the way into the
      // waiting route. A bare TBD names no feeder of its own but still belongs
      // to a match that may have one on its other side, so it opens the same
      // walk rather than being inert.
      const t = !f ? "<i class='pnd'>TBD</i>"
        : "<i class='pnd'>" + f.kind + ' of ' + mmEsc(f.src.identifier || ('#' + f.src.num)) + '</i>';
      return { name: t, score: '' };
    }
    // A flag on every name, in both flows — an international field reads by
    // nationality as much as by name. Costs about a character of node width and
    // nothing at all on the DigitalPool side, which carries no country. It is
    // markup, so it is built outside mmEsc, which would escape it.
    const flag = flagHtml(c);
    // Left to right the rating rides on the name, because width is cheap in a
    // column layout. Stacked it drops to a line of its own, which is the whole
    // point of that shape: the box ends up as wide as the longest name and no
    // wider. Kept inside the player's span either way, so a selection still
    // paints all of it.
    const rt = c.skill_level ? mmEsc('(' + c.skill_level + ')') : '';
    const nm = mmEsc(c.name);
    const sc = score == null ? '' : ' ' + score;
    // The winner is always gold. What a selection changes is handled in CSS:
    // inside a lit node every bold name is muted back except the selected
    // player's, so the two can still never be confused, and a selected player
    // who lost is turned red by the same injected rule. how says which of those
    // a name is; pl-N says whose it is.
    const named = won ? '<b>' + nm + '</b>' : nm;
    const body = wide
      ? (rt ? (won ? '<b>' + nm + ' ' + rt + '</b>' : nm + ' ' + rt) : named)
      : named + (rt ? "<span class='nt-rt'>" + rt + '</span>' : '');
    const how = won ? 'won' : (decided ? 'lost' : 'open');
    // Single-quoted attribute: the label itself is delimited by double quotes,
    // which is why mmEsc strips them from the text in the first place.
    return {
      name: "<span class='pn" + slot + ' ' + how + ' pl-' + pid(c.name) + "'>" + flag + body + '</span>',
      score: sc,
    };
  };
  const id = mmEsc(r.identifier || ('#' + r.match_number));
  const p1 = line(r.challenger1, r.challenger1_score, r.challenger1_is_winner, 1);
  const p2 = line(r.challenger2, r.challenger2_score, r.challenger2_is_winner, 2);
  // Where the loser drops, as a footnote on the match itself rather than a
  // separate node with an edge into it.
  // Parens go through mmEsc like everything else — they are escaped in every
  // other label, and a bare "(" is exactly what Mermaid's parser trips on.
  const drop = dropTo ? "<small class='nd-drop'>" + mmEsc('(L to ' + dropTo + ')') + '</small>' : '';
  // The line under the match number says the one thing worth knowing about when
  // to watch it: which table it is on now, or when it is due to start. Only
  // while it is on one — table_name survives after the match ends, where it is
  // history rather than somewhere to go — and only before, since a scheduled
  // time is a prediction that a played match has already settled.
  let sub = '', subKind = '';
  if (r.status === 'IN_PROGRESS' && r.table_name) {
    sub = mmEsc(tableLabel(r.table_name));
  } else if (r.status !== 'COMPLETED' && !r.is_bye) {
    // Tested against COMPLETED rather than for NOT_STARTED: that is the one
    // status both sources agree on the spelling of, and anything that is
    // neither finished nor under way is by definition still to come.
    sub = mmEsc(timeLabel(r));
    if (sub) subKind = ' tbl-when';
  }
  // Both share the -tbl class, which is what places the row; tbl-when only
  // restyles it, so the stacked flow's row shuffle keys off the one class.
  const table = sub
    ? "<span class='" + (wide ? 'nd' : 'nt') + '-tbl' + subKind + "'>" + sub + '</span>'
    : '';

  // Three columns, laid out by .nd in the stylesheet. The number and the drop
  // share one cell down the left, so the box stays two rows tall whether or not
  // there is a drop to report.
  if (wide) {
    return "<span class='nd'>" +
      "<span class='nd-h'><span class='nd-id'>" + id + '</span>' + table + drop + '</span>' +
      "<span class='nd-p nd-r1'>" + p1.name + "</span><span class='nd-s nd-r1'>" + p1.score.trim() + '</span>' +
      "<span class='nd-p nd-r2'>" + p2.name + "</span><span class='nd-s nd-r2'>" + p2.score.trim() + '</span>' +
      '</span>';
  }
  // One score line between the two names rather than a figure trailing each of
  // them: stacked, the pair reads as a result — 3 : 0 — where two right-aligned
  // numbers in a second column only widened the box to say the same thing.
  const sc1 = r.challenger1_score, sc2 = r.challenger2_score;
  const scoreLine = (sc1 != null || sc2 != null)
    ? "<span class='nt-sc'>" + mmEsc((sc1 == null ? '' : sc1) + ' : ' + (sc2 == null ? '' : sc2)) + '</span>'
    : '';
  return "<span class='nt'>" +
    "<span class='nt-id'>" + id + '</span>' + table +
    "<span class='nt-p'>" + p1.name + '</span>' + scoreLine +
    "<span class='nt-p'>" + p2.name + '</span>' +
    (drop ? "<span class='nt-drop'>" + drop + '</span>' : '') +
    '</span>';
}

// A stage is the pair named by a winners match's two outgoing edges: W3-1 goes
// to W4-1 or drops to L4-4, so W4 and L4 belong together. That gives
// W2/L1, W3/L2, W4/L4, W5/L6, W6/L8, W7/L10 — Wk with L(2k-4), and W2/L1 as
// the exception since there is no L0. W1 stands alone; nothing has dropped yet.
//
// The minor losers rounds (L3, L5, L7, L9) take no drop-downs, so no winners
// round names them. They stay on their own, ordered on the half step between
// the pairs that bracket them: L3 sits at 3.5, between W3/L2 and W4/L4.
//
// The returned number doubles as the group key — rounds sharing a stage share
// a value, and every stage has a distinct one.
function stageOf(round) {
  if (round == null) return 0;
  if (round > 0) return round;
  const n = Math.abs(round);
  if (n === 1) return 2;
  if (n % 2 === 0) return n / 2 + 2;
  return (n - 1) / 2 + 2.5;
}

// The rounds a stage contains, e.g. 4 -> ['W4','L4']. Derived from
// stageOf so the dropdown can never disagree with the grouping.
function stageRounds(stage, haveW, haveL) {
  const out = [];
  if (haveW.has(stage)) out.push('W' + stage);
  for (const n of [...haveL].sort((a, b) => a - b)) {
    if (stageOf(-n) === stage) out.push('L' + n);
  }
  return out;
}

const playerIn = (r, name) =>
  (r.challenger1 && r.challenger1.name === name) ||
  (r.challenger2 && r.challenger2.name === name);

// A selection is a set of players, however it was arrived at: picking a name
// gives a set of one, picking a country gives its whole delegation. Everything
// downstream — the spotlight, the lit nodes, the runs drawn through them, the
// rerouting — then works the same way whether that set holds one player or
// thirty, and both sides of a match answer yes when two of them met.
const selHas = (sel, c) => !!sel && !!c && sel.names.has(c.name);
const selIn = (sel, r) => selHas(sel, r.challenger1) || selHas(sel, r.challenger2);

// A player and a country are two answers to the same question, so only one is
// ever set. Resolving a country to names here rather than testing the code on
// every challenger is also what keeps DigitalPool out of it: its challengers
// carry no country, so they can never land in anyone's set.
function currentSel() {
  if (state.player) {
    return { kind: 'player', label: state.player, names: new Set([state.player]) };
  }
  // A waiting route names no players at all — it is a set of matches — so it
  // carries an empty name set and everything keyed off names simply finds
  // nothing, which is the right answer for it.
  if (state.waiting) {
    const r = state.index && state.index.byNum[state.waiting];
    const id = r ? (r.identifier || '#' + r.num) : '#' + state.waiting;
    return { kind: 'waiting', match: state.waiting, label: 'What ' + id + ' waits on',
      names: new Set() };
  }
  if (!state.country) return null;
  const c = state.countries.find(x => x.code === state.country);
  return {
    kind: 'country',
    label: c ? c.name : state.country.toUpperCase(),
    names: new Set(c ? c.players.map(p => p.name) : []),
  };
}

// Which matches survive the stage cut. Shared with the player search so the
// dropdown and the diagram can never disagree about what is on screen.
function keptMatches(rows, fromStage) {
  const byNum = new Map(rows.map(r => [r.match_number, r]));
  const keep = new Set(rows.filter(r => !r.is_bye).map(r => r.match_number));
  if (!(fromStage > 0)) return keep;
  // Keep whole stages, so picking W4 brings L5/L6 rather than L4 — L4 belongs
  // to stage 3 and would otherwise dangle without its winners round.
  for (const n of Array.from(keep)) {
    const r = byNum.get(n);
    if (r && r.round != null && stageOf(r.round) < fromStage) keep.delete(n);
  }
  // The deep losers rounds outrank the final (L10 vs W7), so a cut past the
  // winners depth would drop it. Every option says "→ final", so honour that.
  for (const r of rows) {
    if (!r.is_bye && r.winner_to_num == null) keep.add(r.match_number);
  }
  return keep;
}

// The cut is a function of the rows and the stage the reader picked, and the
// stage moves far more often than the rows do — ensureVisible asks for one cut
// and buildDiagram then asks for the same one again. Memoised per stage and
// thrown away with the index, so it can never outlive the draw it describes.
function keepFor(fromStage) {
  if (!state.keep.has(fromStage)) {
    state.keep.set(fromStage, keptMatches(state.rows, fromStage));
  }
  return state.keep.get(fromStage);
}

// ---------------------------------------------------------------------------
// The draw, indexed
//
// bracket-algo.js walks the rows once and hands back both directions at once —
// where each match sends its winner and its loser, byes already hopped, and
// what feeds it — along with every player's appearances. index.html has read
// that index for as long as it has had a blockers table.
//
// This page used to rebuild one half of it inside buildDiagram on every render,
// and the other half inside currentSel on every selection and inside
// buildSearchEntries on every keystroke. None of it ever depended on anything
// but the rows, so none of it belonged there.
//
// The index speaks index.html's vocabulary, which is the one the unit tests are
// written against; renaming six fields on the way in is cheaper than teaching
// the index two of them, and the pass costs nothing — buildDiagram walked every
// row to build byNum regardless.
// ---------------------------------------------------------------------------

// row rides along because the index has no use for it and this page does: the
// table, the scheduled time and the scores are all read back off it later.
const canonRow = (r) => ({
  num: r.match_number, is_bye: r.is_bye, round: r.round, identifier: r.identifier,
  p1: r.challenger1, p2: r.challenger2,
  p1Won: r.challenger1_is_winner, p2Won: r.challenger2_is_winner,
  winnerTo: r.winner_to_num, loserTo: r.loser_to_num,
  winnerToPos: r.winner_to_pos, loserToPos: r.loser_to_pos,
  s1: r.challenger1_score, s2: r.challenger2_score, status: r.status,
  row: r,
});

// Stage first, then match number. Match numbers alone are not chronological
// across the two sides — W2 is 33-48 but L1 is 49-64 — so a run sorted by
// number alone would report a player's form in the wrong order.
const runKey = (a) => stageOf(a.round) * 1000 + a.num;

// What the search list and the stage cut want of a player, beyond the bare
// appearances the index collected: their record in the order it was played, and
// the stage their run ended in. A pass over players rather than over matches,
// so it costs the same whether the draw holds sixty of them or four hundred.
function buildPlayerView(idx) {
  const list = [];
  for (const k in idx.players) {
    const p = idx.players[k];
    const at = p.at.slice().sort((x, y) => runKey(x) - runKey(y));
    const decided = at.filter(a => a.decided);
    const form = decided.map(a => (a.won ? 'W' : 'L'));
    // Where to move the cut to if this player is picked while hidden. The stage
    // holding their last loss is the one that ended their run and the one worth
    // landing on; a player still in the running has no loss to aim at, so their
    // last match stands in for it.
    const lost = decided.filter(a => !a.won);
    const end = (lost.length ? lost : at).slice(-1)[0] || null;
    list.push({
      name: p.name, country: p.country, countryName: p.countryName,
      at, form, won: form.filter(x => x === 'W').length, played: form.length,
      endStage: end ? stageOf(end.round) : 0,
    });
  }
  return list.sort((a, b) => a.name.localeCompare(b.name));
}

// Countries represented in the loaded stage, biggest delegation first. A code
// with no flag — WNT's 'unknown' — is not a country anyone can pick.
function buildCountryView(players) {
  const byCode = new Map();
  for (const p of players) {
    if (!p.country || !wntFlag(p.country)) continue;
    if (!byCode.has(p.country)) {
      byCode.set(p.country, {
        code: p.country,
        name: COUNTRY_NAME_OVERRIDE[p.country] || p.countryName || p.country,
        players: [],
      });
    }
    byCode.get(p.country).players.push(p);
  }
  return [...byCode.values()].sort((a, b) =>
    b.players.length - a.players.length || a.name.localeCompare(b.name));
}

// One way in, so the index can never be a bracket behind.
//
// Every path that replaces the rows comes through here: a load, a WNT stage
// switch, the sixty-second refresh. Building the index inside buildDiagram
// would have been the obvious place and would have been wrong — refreshData
// calls resolveSelection before it calls render, so once a minute that call
// would have resolved a name against the previous bracket's roster.
function setRows(rows) {
  state.rows = rows || [];
  state.index = state.rows.length ? buildBracketIndex(state.rows.map(canonRow)) : null;
  state.players = state.index ? buildPlayerView(state.index) : [];
  state.countries = buildCountryView(state.players);
  state.playerBy = new Map(state.players.map(p => [p.name.toLowerCase(), p]));
  state.keep = new Map();
}

function buildDiagram(rows, dir, fromStage) {
  const idx = state.index;
  const byNum = new Map(rows.map(r => [r.match_number, r]));
  // Node width is the crowded dimension only in a top-down flow, where every
  // match in a round sits side by side and the diagram is as wide as the widest
  // round. Left to right a round is a column, so width costs almost nothing and
  // every name can be given in full — an empty map is the whole switch, since
  // the lookup already falls back to the full name.
  const wide = dir === 'LR' || dir === 'RL';
  const pids = new Map();
  const pid = (name) => {
    if (!pids.has(name)) pids.set(name, pids.size);
    return pids.get(name);
  };
  const keep = keepFor(fromStage);
  // No losers side anywhere means a straight knockout — WNT's stage 2. Two
  // things below are double-elimination habits that are wrong for one.
  const singleElim = !rows.some(r => r.round < 0);
  const rCount = roundCounts(rows);
  const rLabel = roundLabels(rows);

  // Both directions come off the shared index. hop answers exactly what this
  // page's own copy of it used to — the number of the first real match down a
  // chain of byes — so every use below reads unchanged, and the feeder map it
  // was half of is now idx.rev, built once when the rows arrived rather than
  // here, once a render.
  const hop = idx.hop;

  // Where each winners match sends its loser, from round 2 on. Rendered as a
  // footnote inside the match box, so no drop edge and no stub node is needed.
  // Not limited to kept matches — the text is useful even when the stage cut
  // puts the destination off-graph.
  const dropTo = new Map();
  for (const r of rows) {
    if (r.is_bye || !(r.round >= 2)) continue;
    const f = idx.fwd[r.match_number];
    const dr = f && f.l != null ? byNum.get(f.l) : null;
    if (dr) dropTo.set(r.match_number, dr.identifier || ('#' + dr.match_number));
  }

  // Only winner progression is drawn now. Drops live in the labels above, and
  // round 1 draws nothing at all — it fans out across the whole of W2 and L1,
  // which is noise. It still needs a rank though: dagre ranks nodes, not
  // clusters, so leaving those edgeless stacks them into a column.
  // A knockout round 1 is exempt: it feeds two-into-one into round 2, which is
  // the clearest part of the diagram rather than noise, and needs no ghosts.
  const edges = [];
  for (const r of rows) {
    if (!keep.has(r.match_number) || (!singleElim && r.round === 1)) continue;
    for (const [dest, kind] of [[r.winner_to_num, 'W'], [r.loser_to_num, 'L']]) {
      if (kind === 'L' && r.round > 0) continue; // shown as a label footnote
      const d = hop(dest);
      if (!d || !keep.has(d)) continue;
      edges.push({ from: r, to: byNum.get(d), kind });
    }
  }

  // So give it one invisible link per match, matched one-to-one rather than to
  // both real destinations: the first half of W1 pins W2, the second half pins
  // L1. This is what puts the winners side on the left — dagre orders each rank
  // to minimise crossings, so whichever round the left half of W1 points at
  // ends up on the left, regardless of the order the subgraphs were emitted in.
  // Every round-1 node lands on the same rank as a row, both destination
  // rounds sit on the rank below, and there is no many-to-many for dagre to
  // untangle. Pairing is positional, not by actual progression — nothing is
  // drawn, so it only has to hold the layout.
  const asc = (a, b) => a.match_number - b.match_number;
  const ghosts = [];
  if (!singleElim) {
    const r1 = [], r2 = [], rl1 = [];
    for (const r of rows) {
      if (r.is_bye || !keep.has(r.match_number)) continue;
      if (r.round === 1) r1.push(r);
      else if (r.round === 2) r2.push(r);
      else if (r.round === -1) rl1.push(r);
    }
    r1.sort(asc); r2.sort(asc); rl1.sort(asc);
    if (r1.length && r1.length === r2.length + rl1.length) {
      r2.forEach((m, i) => ghosts.push([r1[i], m]));
      rl1.forEach((m, j) => ghosts.push([r1[r2.length + j], m]));
    } else {
      // Byes or a non-standard bracket break the halves; fall back to each
      // match's own destinations so no round-1 node is left unranked.
      for (const r of r1) {
        for (const dest of [r.winner_to_num, r.loser_to_num]) {
          const d = hop(dest);
          if (d && keep.has(d)) ghosts.push([r, byNum.get(d)]);
        }
      }
    }
  }

  const lines = [`flowchart ${dir}`];
  const kept = rows.filter(r => keep.has(r.match_number));


  const sgIds = [], stageIds = [];
  const byRound = new Map();
  for (const r of kept) {
    const k = r.round == null ? 0 : r.round;
    if (!byRound.has(k)) byRound.set(k, []);
    byRound.get(k).push(r);
  }
  const allRounds = [...byRound.keys()];
  // Round subgraphs nest inside a stage wrapper; within a stage the winners
  // round leads, then its two losers rounds in order.
  const byStage = new Map();
  for (const k of allRounds) {
    const st = stageOf(k);
    if (!byStage.has(st)) byStage.set(st, []);
    byStage.get(st).push(k);
  }
  // Winners round leads, losers round follows, so the winners side sits left.
  // Only a hint though — the round-1 ghost split below is what actually decides
  // left/right, because dagre orders a rank to minimise crossings.
  for (const list of byStage.values()) {
    list.sort((a, b) => (a > 0 ? -1 : 0) - (b > 0 ? -1 : 0) || Math.abs(a) - Math.abs(b));
  }

  for (const st of [...byStage.keys()].sort((a, b) => a - b)) {
    const inStage = byStage.get(st);
    // Only a genuine pair gets the extra layer. A minor losers round is alone
    // in its stage, so wrapping it would add nesting that groups nothing.
    // Blank title + no stroke/fill: the wrapper exists to constrain layout,
    // not to draw a labelled box. Halved ids keep 3.5 out of the identifier.
    const wrap = inStage.length > 1;
    if (wrap) {
      const stId = 'ST' + Math.round(st * 2);
      stageIds.push(stId);
      lines.push(`  subgraph ${stId}[" "]`);
    }
    const pad = wrap ? '    ' : '  ';
    for (const k of inStage) {
      const id = k === 0 ? 'Rx' : 'R' + (k > 0 ? 'W' : 'L') + Math.abs(k);
      const label = rLabel.get(k) || roundName(k, rCount.get(k) || 0, singleElim);
      sgIds.push(id);
      lines.push(`${pad}subgraph ${id}["${label}"]`);
      for (const r of byRound.get(k) || []) lines.push(`${pad}  M${r.match_number}["${nodeLabel(r, idx, dropTo.get(r.match_number), wide, pid)}"]`);
      lines.push(`${pad}end`);
    }
    if (wrap) lines.push('  end');
  }

  // Links are collected before emission because linkStyle addresses them by
  // position, so the order has to be fixed before any index is handed out.
  const links = [];
  for (const [a, b] of ghosts) links.push({ from: a.match_number, to: b.match_number, ghost: true });
  for (const e of edges) links.push({ from: e.from.match_number, to: e.to.match_number });

  // A selected player's real progression, which includes the two steps drawn
  // for nobody else: out of round 1, and the drop across to the losers side.
  // One pass over the matches rather than one per selected player: each match
  // is walked once and answers for whichever of its two sides are selected.
  // Where two of them were drawn against each other that is both, and the match
  // sends one run on up the winners side and one down to the losers.
  // Nothing below depends on what is selected. The source is the bracket and
  // only the bracket, so choosing a player or a country never asks Mermaid to
  // lay anything out again — at five milliseconds a node that was two seconds
  // a click on a full stage 1. Everything a selection changes is painted onto
  // the rendered SVG afterwards by applySelection().
  links.forEach((l) => lines.push(`  M${l.from} ${l.ghost ? '~~~' : '-->'} M${l.to}`));

  for (const id of sgIds) lines.push(`  style ${id} fill:none,stroke:#334155,color:#64748b`);
  for (const id of stageIds) lines.push(`  style ${id} fill:none,stroke:none`);

  const drawn = links.filter(l => !l.ghost).length;
  // Which paths in the SVG are the invisible round-1 links. They exist only to
  // give dagre something to rank against, and Mermaid draws them with no
  // stroke — but a stroke is exactly what dimming adds, so without this a
  // selection makes the alignment scaffolding appear as edges out of Winners
  // R1 that the bracket deliberately never draws.
  const ghostKeys = new Set(
    links.filter(l => l.ghost).map(l => 'M' + l.from + '|M' + l.to));
  // keep and hop are handed out so applySelection can work out a run without
  // recomputing the cut or re-walking the byes.
  return { src: lines.join('\n'), nodes: keep.size, keep, hop, byNum, pid: pids, ghostKeys,
    cost: { links: links.length, drawn, ghosts: links.length - drawn } };
}

// What a match is still waiting on, all the way back.
//
// An empty slot can only name the one match that will fill it, which is what
// "W of L6-1" says — and in a double elimination that is rarely the answer
// anyone wants. L7-1 waits on L6-1, which waits on L5-1 and on a drop out of
// W4-3, and none of those have been played either. The question a reader
// actually has is which matches must happen before this one can, and which of
// them could be played right now.
//
// So the walk keeps going back through every feeder that has not delivered yet,
// and stops where a match already holds both its players. Those are the
// frontier: nothing is owed to them, they are only waiting their turn, and the
// whole subtree behind them is blocked on exactly those.
//
// Breadth-first over the index's reverse edges, with a seen set rather than
// recursion: the depth is whatever the draw makes it, and a bracket that loops
// back on itself must not take the page down with it.
// A feeder that already has a winner has handed its player over and is holding
// nothing up; only an undecided one is still owed. Which makes "nothing owed"
// the same statement as "both players are known" — one test, used as the walk's
// stopping condition, as the answer to whether a box is worth clicking, and as
// the filter on what a node label calls pending.
const owedTo = (idx, n) => (idx.rev[n] || []).filter((f) => {
  const s = idx.byNum[f.num];
  return s && !s.p1Won && !s.p2Won;
});

function waitingRoute(idx, from) {
  const nodes = new Set(), edges = [], ready = new Set();
  if (!idx || !idx.byNum[from]) return { nodes, edges, ready };
  const seen = new Set([from]);
  const queue = [from];
  while (queue.length) {
    const n = queue.shift();
    nodes.add(n);
    const owed = owedTo(idx, n);
    if (!owed.length) { ready.add(n); continue; }
    for (const f of owed) {
      edges.push([f.num, n]);
      if (seen.has(f.num)) continue;
      seen.add(f.num);
      queue.push(f.num);
    }
  }
  return { nodes, edges, ready };
}

// What a selection lights up, and the runs through it. Pure computation over
// the rows and the diagram's own keep/hop, so it costs nothing next to a
// render — this is the whole reason selecting is now instant.
function selectionRuns(idx, d, sel) {
  const nodes = new Set(), runs = [], ready = new Set();
  if (!sel || !d || !idx) return { nodes, runs, ready, focus: null };

  // A waiting route is a selection like any other, so that everything painted
  // downstream — the lit nodes, the drawn edges, the dimming of everything
  // else — works on it unchanged. All that differs is how the set was arrived
  // at: backwards along the feeders instead of forwards along one player's
  // results. No focus, because the reader just clicked the node in question and
  // scrolling away from it would be perverse.
  if (sel.kind === 'waiting') {
    const r = waitingRoute(idx, sel.match);
    for (const n of r.nodes) if (d.keep.has(n)) nodes.add(n);
    for (const n of r.ready) if (d.keep.has(n)) ready.add(n);
    for (const [a, b] of r.edges) if (d.keep.has(a) && d.keep.has(b)) runs.push([a, b]);
    return { nodes, runs, ready, focus: null };
  }

  // Walked per selected player rather than per match. A delegation of thirty in
  // a four-hundred-match stage is thirty short walks down a roster the index
  // already collected, where this used to be four hundred tests of both sides
  // of every match in the draw.
  //
  // Where two of them were drawn against each other the match is reached twice,
  // once from each side, and that is exactly right: nodes is a set so it lights
  // once, and the two runs out of it — one on up the winners side, one down to
  // the losers — are both wanted.
  for (const name of sel.names) {
    const p = idx.players[name.toLowerCase()];
    if (!p) continue;
    for (const a of p.at) {
      if (!d.keep.has(a.num)) continue;
      nodes.add(a.num);
      if (!a.decided) continue;
      const f = idx.fwd[a.num];
      const next = f ? (a.won ? f.w : f.l) : null;
      if (next != null && d.keep.has(next)) runs.push([a.num, next]);
    }
  }
  // Where the selection enters the visible bracket — earliest stage wins, so it
  // works whichever side that is, and it follows the cut rather than assuming
  // round 1 is on screen. Match number only breaks ties within a stage.
  let focus = null;
  for (const n of nodes) {
    const st = stageOf(idx.byNum[n].round);
    if (!focus || st < focus.st || (st === focus.st && n < focus.n)) focus = { n, st };
  }
  return { nodes, runs, ready, focus: focus && focus.n };
}

// Paint a selection onto the SVG that is already on screen. Nothing here asks
// Mermaid for anything, so it is a few milliseconds however big the bracket is.
function applySelection(sel, opts) {
  const root = $('graph');
  const d = state.diagram;
  if (!root.querySelector('svg') || !d) return;
  const { nodes, runs, ready, focus } = selectionRuns(state.index, d, sel);

  // Wipe the last selection first: classes off, and the paths we drew ourselves
  // removed outright, since a different selection needs different ones.
  for (const el of root.querySelectorAll('.is-hi, .is-faint, .is-run, .is-next')) {
    el.classList.remove('is-hi', 'is-faint', 'is-run', 'is-next');
  }
  for (const el of root.querySelectorAll('path.is-added')) el.remove();

  // Live is data, not selection, but it lives in the same layer of classes.
  const live = new Set(state.rows
    .filter(r => !r.is_bye && r.status === 'IN_PROGRESS').map(r => r.match_number));
  for (const gEl of root.querySelectorAll('g.node')) {
    const m = (gEl.id || '').match(NODE_ID);
    if (!m) continue;
    const n = +m[1].slice(1);
    gEl.classList.toggle('is-live', live.has(n));
    if (nodes.has(n)) gEl.classList.add('is-hi');
    if (ready.has(n)) gEl.classList.add('is-next');
  }

  // One injected rule carries who is selected, rather than the label markup
  // carrying it — which is what let the labels stop depending on the selection.
  const ids = [];
  for (const name of (sel ? sel.names : [])) {
    const i = d.pid.get(name);
    if (i != null) ids.push(i);
  }
  let css = '';
  if (ids.length) {
    css = '#graph g.node.is-hi :is(' + ids.map(i => '.pl-' + i).join(',') + ').won b' +
      '{color:#fbbf24!important}\n' +
      '#graph g.node.is-hi :is(' + ids.map(i => '.pl-' + i).join(',') + ').lost' +
      '{color:#f87171!important}';
  }
  $('sel-style').textContent = css;

  drawRuns(runs, state.dir, !!sel, d.ghostKeys);
  // A waiting route is counted by what it is blocked on rather than by how much
  // of the bracket it covers, which is the only thing anyone wants to know
  // about it — "seven matches, two of them playable now".
  $('counts').textContent = !sel ? countsLine()
    : sel.kind === 'waiting'
      ? `${sel.label}: ${nodes.size} match${nodes.size === 1 ? '' : 'es'} back, ` +
        `${ready.size} ready to play`
      : `${sel.label}: ${nodes.size} match${nodes.size === 1 ? '' : 'es'} shown of ${d.nodes}`;
  if (opts && opts.centre) {
    if (focus != null) {
      const el = findNodeEl('M' + focus);
      if (el) centerOn(el);
    } else {
      // Instant rather than smooth: this is where the page opens, and animating
      // the first paint from the corner of a four-hundred-match bracket is a
      // long slide past everything the reader did not ask to see.
      centerOnNodes(actionNodes(), false);
    }
  }
}

function countsLine() {
  const total = state.rows.filter(r => !r.is_bye).length;
  const live = state.rows.filter(r => r.status === 'IN_PROGRESS').length;
  const left = state.rows.filter(r => !r.is_bye && r.status !== 'COMPLETED').length;
  const shown = state.diagram ? state.diagram.nodes : total;
  return `${shown} of ${total} matches · ${left} left · ${live} in progress`;
}

// ---------------------------------------------------------------------------
// Search — the same list index.html shows: countries first, then names, each
// with its flag. Ranking matches too: prefix matches rank above mid-word ones,
// and every token has to match somewhere.
// ---------------------------------------------------------------------------
const SEARCH_CAP = 12;
let searchHits = [], searchCursor = -1;

// Extra strings that should find a country, beyond its shown name. Covers the
// names WNT overrides plus the everyday forms of ones it lists formally.
const COUNTRY_SEARCH_ALIASES = {
  tw: ['chinese taipei', 'taipei', 'formosa'],
  us: ['usa', 'america', 'united states of america'],
  gb: ['uk', 'britain', 'great britain'],
  nl: ['holland'],
  vn: ['vietnam'],
  kr: ['south korea'],
  ae: ['uae'],
  cz: ['czechia', 'czech republic'],
  ru: ['russia'],
};

function reEsc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

// A country is a hit on a prefix of its name, of any word in its name, or of
// any alias. Two characters is enough — "li" should reach Lithuania — but a
// single letter is not, or a third of the field would answer to "a".
function countryMatchScore(c, q) {
  if (!q) return -1;
  const name = c.name.toLowerCase();
  const cands = [name].concat(
    name.split(/\s+/).filter(w => w.length >= 3),
    COUNTRY_SEARCH_ALIASES[c.code] || []);
  if (q === c.code) return 1;
  let best = -1;
  for (const cand of cands) {
    if (q === cand) return 0;
    if (q.length >= 2 && cand.indexOf(q) === 0) best = 1;
  }
  return best;
}

function rankCountries(query) {
  const q = query.toLowerCase().trim();
  if (!q) return [];
  const hits = [];
  for (const c of state.countries) {
    const score = countryMatchScore(c, q);
    if (score >= 0) hits.push({ c, score });
  }
  hits.sort((a, b) => a.score - b.score || b.c.players.length - a.c.players.length);
  return hits.map(h => h.c);
}

function rankPlayers(query, players) {
  players = players || state.players;
  const toks = query.toLowerCase().trim().split(/\s+/).filter(Boolean);
  if (!toks.length) return players.slice().sort((a, b) => a.name.localeCompare(b.name));
  const scored = [];
  for (const p of players) {
    const lname = p.name.toLowerCase();
    const words = lname.split(/\s+/);
    let score = 0, ok = true;
    for (const tk of toks) {
      if (lname.indexOf(tk) === 0) continue;
      if (words.some(w => w.indexOf(tk) === 0)) { score += 1; continue; }
      if (lname.indexOf(tk) !== -1) { score += 3; continue; }
      ok = false;
      break;
    }
    if (ok) scored.push({ p, score });
  }
  scored.sort((a, b) => a.score - b.score || a.p.name.localeCompare(b.p.name));
  return scored.map(s => s.p);
}

function highlightName(name, toks) {
  if (!toks.length) return esc(name);
  const parts = name.split(new RegExp('(' + toks.map(reEsc).join('|') + ')', 'ig'));
  return parts.map((p, i) => (i % 2 === 1 ? '<mark>' + esc(p) + '</mark>' : esc(p))).join('');
}

// A flag for the dropdown. Ordinary HTML here — unlike the diagram labels, this
// is not going through Mermaid, so esc() is the right escape.
function searchFlagHtml(code, name, cls) {
  if (!code) return '';
  const cc = String(code).toLowerCase();
  const label = esc(name || cc);
  if (FLAG_IMG[cc]) {
    return '<span class="' + cls + ' flag-img flag-' + cc + '" role="img" aria-label="' +
      label + '" title="' + label + '"></span>';
  }
  const flag = wntFlag(cc);
  return flag ? '<span class="' + cls + '" title="' + label + '">' + flag + '</span>' : '';
}

// One flat list so a single cursor walks countries and names alike. Countries
// lead, because a two-letter query that hits one is almost always meant as one.
// Countries lead the list, so how many of them can lead it is capped: a short
// prefix reaches several, and the list only holds SEARCH_CAP rows, so without a
// limit the names you were typing towards would be pushed off the bottom.
const COUNTRY_CAP = 4;

function buildSearchEntries(query) {
  const players = state.players;
  const countries = rankCountries(query);
  const entries = countries.slice(0, COUNTRY_CAP).map(c => ({ kind: 'country', country: c }));
  const named = rankPlayers(query, players);
  const listed = new Set(named.map(p => p.name));
  for (const p of named) entries.push({ kind: 'player', player: p });
  // Only one country matched, so its roster is unambiguous — list the rest of
  // it under the name hits rather than making you click through first.
  if (countries.length === 1) {
    const roster = countries[0].players.slice().sort((a, b) => a.name.localeCompare(b.name));
    let added = 0;
    for (const p of roster) {
      if (listed.has(p.name)) continue;
      if (!added) entries.push({ kind: 'section', label: 'Players from ' + countries[0].name });
      added++;
      entries.push({ kind: 'player', player: p });
    }
  }
  return entries;
}

function renderResults() {
  const list = $('player-list');
  if (!state.rows.length) { list.innerHTML = ''; return; }
  const query = $('player-input').value;
  const toks = query.toLowerCase().trim().split(/\s+/).filter(Boolean);
  let all = buildSearchEntries(query);
  // Section headings are labels, not targets, so they never enter the hit list
  // and never count against the cap.
  const selectable = all.filter(e => e.kind !== 'section');
  const capped = selectable.length > SEARCH_CAP;
  if (capped) {
    let kept = 0;
    all = all.filter(e => e.kind === 'section' || ++kept <= SEARCH_CAP);
  }
  searchHits = all.filter(e => e.kind !== 'section');
  searchCursor = searchHits.length ? 0 : -1;
  if (!searchHits.length) {
    list.innerHTML = '<div class="pse-empty">No player or country matches &ldquo;' + esc(query) + '&rdquo;</div>';
    return;
  }
  let html = '', hit = -1;
  for (const e of all) {
    if (e.kind === 'section') { html += '<div class="pse-section">' + esc(e.label) + '</div>'; continue; }
    const active = ++hit === 0 ? ' active' : '';
    if (e.kind === 'country') {
      const c = e.country;
      html += '<div class="pse-item pse-country' + active + '" role="option" data-country="' + esc(c.code) + '">' +
        searchFlagHtml(c.code, c.name, 'pse-flag') +
        '<span class="pse-name">' + highlightName(c.name, toks) + '</span>' +
        '<span class="pse-meta">' + c.players.length + ' player' + (c.players.length === 1 ? '' : 's') + '</span>' +
        '<span class="pse-chevron">&#9656;</span></div>';
      continue;
    }
    const p = e.player;
    html += '<div class="pse-item' + active + '" role="option" data-name="' + esc(p.name) + '">' +
      '<span class="pse-name">' + searchFlagHtml(p.country, p.countryName, 'pf') +
      highlightName(p.name, toks) + '</span>' +
      '<span class="pse-meta">' + p.form.map(ch =>
        '<span class="f' + ch.toLowerCase() + '">' + ch + '</span>').join('') + '</span></div>';
  }
  if (capped) {
    html += '<div class="pse-empty">Showing ' + searchHits.length + ' of ' + selectable.length +
      ' &mdash; keep typing to narrow</div>';
  }
  list.innerHTML = html;
  list.scrollTop = 0;
}

function moveCursor(delta) {
  if (!searchHits.length) return;
  const items = $('player-list').querySelectorAll('.pse-item');
  if (searchCursor >= 0 && items[searchCursor]) items[searchCursor].classList.remove('active');
  searchCursor = (searchCursor + delta + searchHits.length) % searchHits.length;
  const el = items[searchCursor];
  if (el) { el.classList.add('active'); el.scrollIntoView({ block: 'nearest' }); }
}

function activateEntry(e) {
  if (!e) return;
  if (e.kind === 'country') select(null, e.country.code);
  else select(e.player.name, null);
}

function setCut(stage) {
  const el = $('round-from');
  const pick = stage >= 2 && el.querySelector('option[value="' + stage + '"]') ? stage : 0;
  state.fromStage = pick;
  el.value = String(pick);
  el.classList.toggle('filtered', pick > 0);
}

// If the current cut hides every one of this selection's matches, widen it
// until it doesn't. For a player the stage holding their last loss is the

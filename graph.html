// target: that is the match that ended their run, and the one you want to land
// on. Players still in the running have no loss to aim at, so their last match
// is used instead.
function ensureVisible(sel) {
  if (!sel) return;
  const keep = keepFor(state.fromStage);
  // A waiting route runs backwards into earlier rounds, which is precisely what
  // a stage cut takes away — so the cut gives way to it, or the answer sits off
  // screen. Open up to the earliest stage the route reaches, and only when some
  // of it is actually hidden.
  if (sel.kind === 'waiting') {
    const r = waitingRoute(state.index, sel.match);
    if (!r.nodes.size) return;
    let lo = Infinity, hidden = false;
    for (const n of r.nodes) {
      const row = state.index.byNum[n];
      lo = Math.min(lo, stageOf(row ? row.round : null));
      if (!keep.has(n)) hidden = true;
    }
    if (hidden) setCut(Number.isFinite(lo) ? Math.floor(lo) : 0);
    return;
  }
  // Off the roster rather than out of a sweep: the question is only whether any
  // of this selection's matches survived the cut, and the index already knows
  // which matches those are.
  let any = false, shown = false;
  for (const name of sel.names) {
    const p = state.playerBy.get(name.toLowerCase());
    if (!p) continue;
    for (const a of p.at) {
      any = true;
      if (keep.has(a.num)) { shown = true; break; }
    }
    if (shown) break;
  }
  if (!any || shown) return;
  // A delegation ends in as many places as it has players, so there is no one
  // match to aim at — show the whole bracket rather than pick for them.
  if (sel.names.size !== 1) { setCut(0); return; }
  const [only] = sel.names;
  // endStage is the stage holding this player's last loss, worked out when the
  // rows arrived. Options are whole winners-anchored stages, so round down: a
  // match at stage 3.5 is kept by the stage-3 cut, since the cut keeps
  // everything at or past it.
  const p = state.playerBy.get(only.toLowerCase());
  setCut(p ? Math.floor(p.endStage) : 0);
}

// A player and a country are two answers to the same question, so choosing
// either drops the other. Pass nothing to clear.
function select(player, country, waiting) {
  state.player = player || null;
  state.country = (!player && country) || null;
  state.waiting = (!player && !country && waiting) || null;
  const sel = currentSel();
  const before = state.fromStage;
  ensureVisible(sel);
  pickPlayerUI(sel);
  closeSearch();
  syncUrl();
  // Only a moved cut changes the bracket, and only that needs Mermaid. Picking
  // someone is painted straight onto the diagram already on screen.
  if (state.fromStage !== before) render();
  else applySelection(sel, { centre: true });
}

// Options are stages, built from the rounds the bracket actually has, so each
// entry names exactly what it keeps: "W4 / L5-L6 → final".
function populateRounds(rows) {
  const sel = $('round-from');
  // The cut keeps everything from a stage onward, which only means something
  // where matches lead somewhere. A group stage has no progression at all, so
  // every option would keep the whole thing — keptMatches re-adds any match
  // with no winner destination, and there that is all of them.
  const progresses = rows.some(r => !r.is_bye && r.winner_to_num != null);
  $('from-group').hidden = !progresses;
  if (!progresses) {
    state.fromStage = 0;
    sel.innerHTML = '<option value="0">All stages</option>';
    sel.value = '0';
    sel.classList.remove('filtered');
    return;
  }

  const w = new Set(), l = new Set();
  for (const r of rows) {
    if (r.is_bye || r.round == null) continue;
    (r.round > 0 ? w : l).add(Math.abs(r.round));
  }
  // Cut points are the winners-anchored stages; a minor losers round sits on a
  // half step and makes no sense as a "from here to the end" boundary.
  const maxStage = Math.max(0, ...w);
  // In a knockout a stage is a single round, so it is named the way the
  // subgraph is: "Quarterfinals → final", not "W4 → final".
  const singleElim = !l.size;
  const rCount = roundCounts(rows);
  const rLabel = roundLabels(rows);
  // Cut points stop at the deepest winners round, but the bracket can run past
  // it — L10 outlives W7, and WNT's L4 outlives W3 — so the last option is only
  // the last one when nothing sits beyond it.
  const lastStage = Math.max(0, ...[...w].map(n => stageOf(n)), ...[...l].map(n => stageOf(-n)));
  // One match with nowhere to send its winner is a final. Sixty-four of them is
  // a qualifying stage, which ends without one.
  const tail = rows.filter(r => !r.is_bye && r.winner_to_num == null).length === 1
    ? ' → final' : ' → end';
  sel.innerHTML = '<option value="0">All stages</option>';
  for (let s = 2; s <= maxStage; s++) {
    const parts = stageRounds(s, w, l);
    if (!parts.length) continue;
    const wPart = parts.filter(p => p[0] === 'W');
    const lPart = parts.filter(p => p[0] === 'L');
    const label = rLabel.get(s) || (singleElim
      ? roundName(s, rCount.get(s) || 0, true)
      : [wPart.join(''), lPart.join('-')].filter(Boolean).join(' / '));
    const o = document.createElement('option');
    o.value = String(s);
    // Nothing beyond this stage to cut down to, so the suffix says nothing.
    o.textContent = s >= lastStage ? label : label + tail;
    sel.appendChild(o);
  }
  if (state.fromStage > maxStage) state.fromStage = 0;
  sel.value = String(state.fromStage);
  sel.classList.toggle('filtered', state.fromStage > 0);
}

// WNT only, and only worth showing when there is a choice to make.
function populateStages(stages) {
  const sel = $('stage-sel');
  $('stage-group').hidden = stages.length < 2;
  sel.innerHTML = '';
  for (const s of stages) {
    const o = document.createElement('option');
    o.value = String(s.stage);
    o.textContent = 'Stage ' + s.stage + ' · ' + s.count + ' matches';
    sel.appendChild(o);
  }
  if (stages.length) sel.value = String(state.stage);
}

// Mermaid ids its node groups "flowchart-<id>-<n>". Match on a boundary so M1
// does not also hit M10 or M12.
function findNodeEl(mid) {
  const re = new RegExp('(^|[^A-Za-z0-9])' + mid + '([^0-9]|$)');
  for (const g of $('graph').querySelectorAll('g.node')) {
    if (re.test(g.id || '')) return g;
  }
  return null;
}

// ---------------------------------------------------------------------------
// The highlighted player's edges, redrawn after Mermaid has rendered
//
// Mermaid itself is untouched: it parses and lays the diagram out exactly as
// before, we drop its SVG into the page, and then we overwrite the `d` string
// of the handful of paths that make up the selected player's run. No hook, no
// fork, no custom renderer — the same kind of edit as setting a style on an
// element after load. Every faint edge keeps the spline Mermaid gave it, so
// the diagram around the player is pixel-for-pixel what it always was.
//
// Each highlighted edge becomes the same cubic. Its two control points sit
// directly under the start point and directly over the end point, sharing one
// coordinate between the two ranks — the "lane". A cubic leaves P0 heading at
// P1 and arrives at P3 coming from P2, so that placement alone makes the edge
// exit square out of the source's bottom face and enter square into the
// destination's top face:
//
//        ┌──────┐
//        └──┬───┘   P0 = source's bottom face
//           ●───────────────●        P1 and P2, both on the lane
//                           │
//                      ┌────▼──┐
//                      └───────┘   P3 = destination's top face
//
// The arrowhead is a marker-end declared orient="auto", which is a plain SVG
// feature: the browser re-aims the marker along whatever path it is attached
// to. So nothing below touches an arrow.
//
// In LR the whole construction is transposed — right face to left face.
// ---------------------------------------------------------------------------

// Mermaid's pointEnd marker is 8 user units wide with its reference point in
// the middle, so its tip overhangs the path's last point by 4. Stopping that
// far short puts the tip on the border instead of inside the box.
const ARROWHEAD = 4;

// Mermaid names an edge path after the two nodes it joins ("L_M107_M113_0",
// carried on the path as data-id), and repeats a node's own id inside its
// group id ("…-flowchart-M107-42"). Those two are the whole interface.
const EDGE_ID = /^L_(M\d+)_(M\d+)_\d+$/;
const NODE_ID = /(?:^|[^A-Za-z0-9])(M\d+)(?![0-9])/;

// getBBox measures in the element's own coordinates and leaves the element's
// own transform out; getCTM includes that transform and every one above it. So
// the node's CTM composed with the inverse of the edge layer's puts the node's
// box in exactly the user space the paths' `d` strings are written in.
function boxInPathSpace(el, inv) {
  const b = el.getBBox();
  const m = inv.multiply(el.getCTM());
  const xs = [], ys = [];
  for (const p of [[b.x, b.y], [b.x + b.width, b.y],
                   [b.x, b.y + b.height], [b.x + b.width, b.y + b.height]]) {
    xs.push(m.a * p[0] + m.c * p[1] + m.e);
    ys.push(m.b * p[0] + m.d * p[1] + m.f);
  }
  return { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) };
}

const bez = (t, p0, p1, p2, p3) => {
  const u = 1 - t;
  return u * u * u * p0 + 3 * u * u * t * p1 + 3 * u * t * t * p2 + t * t * t * p3;
};

// How many sample points of a candidate curve land inside some other node's
// box. Edges paint under nodes, so a route straight through a rank disappears
// into it — this is the number the lane search minimises.
function buried(sx, sy, dx, dy, lane, vert, boxes) {
  let hit = 0;
  for (let j = 1; j < 40; j++) {
    const t = j / 40;
    const x = vert ? bez(t, sx, sx, dx, dx) : bez(t, sx, lane, lane, dx);
    const y = vert ? bez(t, sy, lane, lane, dy) : bez(t, sy, sy, dy, dy);
    for (const b of boxes) {
      if (x >= b.x0 && x <= b.x1 && y >= b.y0 && y <= b.y1) { hit++; break; }
    }
  }
  return hit;
}

// runs are the selected players' steps, as [from, to] match numbers.
//
// Two of them exist in the SVG already — a winners-side or losers-side
// progression is an edge Mermaid drew — and those are marked and rerouted. The
// rest are steps the bracket deliberately does not draw: round one, whose
// fan-out is the noise the ghost links hide, and the drop across to the losers
// side, which is a footnote inside the box. Those used to be added to the
// source, which meant Mermaid laid the whole diagram out again. They are drawn
// here instead, with the same geometry the rerouting already computes, so a
// selection never costs a relayout.
//
// dim says whether the rest of the diagram should fall back — it should when
// something is selected, and not when the selection was just cleared. ghosts
// are the invisible round-1 links, which must be neither lit nor dimmed.
function drawRuns(runs, dir, dim, ghosts) {
  try {
    const root = $('graph');
    const all = [...root.querySelectorAll('path[data-id]')];
    if (!all.length) return -1;
    const want = new Map(runs.map(([a, b]) => ['M' + a + '|M' + b, [a, b]]));
    const paths = [];
    const seen = new Set();
    for (const p of all) {
      const m = (p.getAttribute('data-id') || '').match(EDGE_ID);
      const key = m ? m[1] + '|' + m[2] : null;
      // A ghost is left strictly alone. Lighting one would draw a step the
      // bracket omits on purpose, and dimming one hands a stroke to a link that
      // is meant to have none — which is how selecting anything used to make
      // the round-1 scaffolding appear as edges into Winners R2. A real run
      // between the same two matches is still drawn, as a clone below.
      if (key && ghosts && ghosts.has(key)) continue;
      if (key && want.has(key)) {
        p.classList.add('is-run');
        seen.add(key);
        paths.push({ p, a: m[1], b: m[2] });
      } else if (dim) {
        p.classList.add('is-faint');
      }
    }
    // Whatever is left has no path of its own. Clone one so the arrow marker
    // and the layer come with it, then give it our own shape below.
    const proto = all[0];
    for (const [key, [a, b]] of want) {
      if (seen.has(key)) continue;
      const p = proto.cloneNode(false);
      // Add to the cloned classes, never replace them: Mermaid's own
      // .flowchart-link is what carries `fill: none`, and a curve with a fill
      // paints in the whole area it encloses. fill is pinned here as well, so
      // this cannot come back if the class Mermaid uses ever changes name.
      p.classList.add('is-run', 'is-added');
      p.setAttribute('fill', 'none');
      p.removeAttribute('id');            // the clone must not duplicate one
      p.setAttribute('data-id', 'L_M' + a + '_M' + b + '_0');
      p.setAttribute('d', '');
      proto.parentNode.appendChild(p);
      paths.push({ p, a: 'M' + a, b: 'M' + b });
    }
    if (!paths.length) return 0;

    // Every edge path is a direct child of the same <g>, with no transform of
    // its own, so one inverse serves all of them.
    const ctm = paths[0].p.getCTM();
    if (!ctm) return -1;
    const inv = ctm.inverse();

    const box = new Map();
    for (const g of root.querySelectorAll('g.node')) {
      const m = (g.id || '').match(NODE_ID);
      if (m) box.set(m[1], boxInPathSpace(g, inv));
    }

    const vert = dir !== 'LR' && dir !== 'RL';
    // Bottom to top: downstream is upwards, so every comparison below that
    // assumes the destination sits lower has to be turned around.
    const up = dir === 'BT';
    const face = (bx) => vert ? bx.x1 - bx.x0 : bx.y1 - bx.y0;
    // One selected player's run is a chain, so each face carries a single
    // highlighted edge and there is nothing to spread. A delegation is not: a
    // match with two of them in it sends one edge on and one down out of the
    // same face, and a match they both feed takes two into the same face.
    //
    // So each face's edges are ordered by where their other end sits and laid
    // out evenly across it. With one edge that reduces to the old behaviour —
    // centre, then shifted off it towards the far end, because the faint feeder
    // Mermaid drew into that same face still lands near the middle and two
    // arrowheads on one spot read as a single broken arrow.
    const nudge = (size, towards) => Math.sign(towards) * Math.min(size * 0.3, 14);
    const at = (lo, hi, i, n, towards) => (n > 1)
      ? lo + (hi - lo) * (i + 1) / (n + 1)
      : (lo + hi) / 2 + nudge(hi - lo, towards);

    // Group by the face each edge leaves and the face it arrives at, then sort
    // each group along that face so the fan-out does not cross itself.
    const mid = (bx) => vert ? (bx.x0 + bx.x1) / 2 : (bx.y0 + bx.y1) / 2;
    const out = new Map(), into = new Map();
    const push = (m, k, v) => { if (!m.has(k)) m.set(k, []); m.get(k).push(v); };
    for (const q of paths) {
      if (!box.get(q.a) || !box.get(q.b)) continue;
      push(out, q.a, q);
      push(into, q.b, q);
    }
    for (const list of out.values()) list.sort((p, q) => mid(box.get(p.b)) - mid(box.get(q.b)));
    for (const list of into.values()) list.sort((p, q) => mid(box.get(p.a)) - mid(box.get(q.a)));

    // Only needed by the lane search; most chains contain at most one edge
    // that travels far enough sideways to want it.
    let allBoxes = null;

    const n = (v) => Math.round(v * 100) / 100;
    let done = 0;

    for (let pi = 0; pi < paths.length; pi++) {
      const { p, a, b } = paths[pi];
      const S = box.get(a), D = box.get(b);
      if (!S || !D) continue;                  // an id we cannot place: leave it alone
      const scx = (S.x0 + S.x1) / 2, scy = (S.y0 + S.y1) / 2;
      const dcx = (D.x0 + D.x1) / 2, dcy = (D.y0 + D.y1) / 2;
      const og = out.get(a) || [], ig = into.get(b) || [];
      const oi = og.indexOf(paths[pi]), ii = ig.indexOf(paths[pi]);
      let sx, sy, dx, dy, lo, hi;
      if (vert) {
        sx = at(S.x0, S.x1, oi, og.length, dcx - scx);
        dx = at(D.x0, D.x1, ii, ig.length, scx - dcx);
        // Flowing upwards turns the construction over: the edge leaves the
        // source's top face and arrives at the destination's bottom, and the
        // arrowhead overhang is added rather than subtracted so the tip still
        // lands on the border instead of inside the box.
        sy = up ? S.y0 : S.y1;
        dy = up ? D.y1 + ARROWHEAD : D.y0 - ARROWHEAD;
        lo = sy; hi = dy;
      } else {
        sy = at(S.y0, S.y1, oi, og.length, dcy - scy);
        dy = at(D.y0, D.y1, ii, ig.length, scy - dcy);
        sx = S.x1; dx = D.x0 - ARROWHEAD;
        lo = sx; hi = dx;
      }
      // Not comfortably downstream — a same-rank or backwards edge is not the
      // case this was written for, so leave Mermaid's own path in place. One we
      // drew ourselves has no path to fall back on, so it gets a straight line.
      // Distance rather than sign: flowing up, hi is above lo and the old
      // test rejected every edge in the diagram.
      if (![sx, sy, dx, dy].every(Number.isFinite) || !(Math.abs(hi - lo) > 8)) {
        if (p.classList.contains('is-added') && [sx, sy, dx, dy].every(Number.isFinite)) {
          p.setAttribute('d', `M${n(sx)},${n(sy)} L${n(dx)},${n(dy)}`);
          done++;
        }
        continue;
      }

      // A near-vertical edge — every winners→winners and losers→losers hop —
      // can only run through the empty gutter between two ranks, so the
      // midpoint lane is always right and there is nothing to search for. The
      // drop across to the losers side crosses a whole row of boxes and would
      // vanish behind them, so for that one, try 19 lanes and keep the least
      // buried. Ties go to the midpoint, the symmetric S you want when clear.
      let lane = (lo + hi) / 2;
      const travel = Math.abs(vert ? dx - sx : dy - sy);
      if (travel > 3 * face(S)) {
        if (!allBoxes) allBoxes = [...box.values()];
        const near = allBoxes.filter(bx => bx !== S && bx !== D &&
          bx.x1 >= Math.min(sx, dx) - 2 && bx.x0 <= Math.max(sx, dx) + 2 &&
          bx.y1 >= Math.min(sy, dy) - 2 && bx.y0 <= Math.max(sy, dy) + 2);
        let best = null;
        for (let i = 1; i <= 19; i++) {
          const f = i / 20, cand = lo + (hi - lo) * f;
          const hitN = buried(sx, sy, dx, dy, cand, vert, near);
          const off = Math.abs(f - 0.5);
          if (!best || hitN < best.hit || (hitN === best.hit && off < best.off)) best = { cand, hit: hitN, off };
        }
        if (best) lane = best.cand;
      }

      p.setAttribute('d', vert
        ? `M${n(sx)},${n(sy)} C${n(sx)},${n(lane)} ${n(dx)},${n(lane)} ${n(dx)},${n(dy)}`
        : `M${n(sx)},${n(sy)} C${n(lane)},${n(sy)} ${n(lane)},${n(dy)} ${n(dx)},${n(dy)}`);
      done++;
    }
    return done;
  } catch (err) {
    // A selector or a coordinate space that moved under us is not worth losing
    // the graph over: Mermaid's own paths are still there, detours and all.
    console.warn('Runs left as Mermaid routed them:', err);
    return -1;
  }
}

// The page is the only scroll container now, on both axes. getBoundingClientRect
// reports painted pixels, so the zoom is already in the numbers.
function centerOn(el) {
  const er = el.getBoundingClientRect();
  const x = er.left + window.scrollX + er.width / 2 - window.innerWidth / 2;
  const y = er.top + window.scrollY + er.height / 2 - window.innerHeight / 2;
  window.scrollTo({ left: Math.max(0, x), top: Math.max(0, y), behavior: 'smooth' });
}

// Bring a whole set of matches into view rather than one, because what is being
// played is usually several matches at once and centring on an arbitrary member
// of a round puts the rest of it off screen. One pass over the nodes: looking
// each up would be a scan of the diagram per match.
function centerOnNodes(nums, smooth) {
  const want = new Set(nums.map(n => 'M' + n));
  if (!want.size) return false;
  let l = Infinity, t = Infinity, r = -Infinity, b = -Infinity;
  for (const g of $('graph').querySelectorAll('g.node')) {
    const m = (g.id || '').match(NODE_ID);
    if (!m || !want.has(m[1])) continue;
    const q = g.getBoundingClientRect();
    l = Math.min(l, q.left); t = Math.min(t, q.top);
    r = Math.max(r, q.right); b = Math.max(b, q.bottom);
  }
  if (!Number.isFinite(l)) return false;
  window.scrollTo({
    left: Math.max(0, l + window.scrollX + (r - l) / 2 - window.innerWidth / 2),
    top: Math.max(0, t + window.scrollY + (b - t) / 2 - window.innerHeight / 2),
    behavior: smooth ? 'smooth' : 'auto',
  });
  return true;
}

// Where the tournament actually is, for a reader who has selected nothing.
// Opening at the top-left corner shows the end of the draw — flowing bottom to
// top that is the final, of an event that may not have started. What is being
// played is the answer; failing that the match due next; failing that the final,
// because the event is over and that is the thing worth arriving at.
function actionNodes() {
  const d = state.diagram;
  if (!d) return [];
  const kept = state.rows.filter(r => !r.is_bye && d.keep.has(r.match_number));
  const live = kept.filter(r => r.status === 'IN_PROGRESS');
  if (live.length) return live.map(r => r.match_number);
  const key = (r) => stageOf(r.round) * 1000 + r.match_number;
  const todo = kept.filter(r => r.status !== 'COMPLETED');
  if (todo.length) return [todo.reduce((a, b) => (key(b) < key(a) ? b : a)).match_number];
  // Everything is played, so the end of the draw is what to arrive at — the
  // deepest match by the same ordering a run uses. Not "the one with nowhere to
  // send its winner": a qualifying stage has sixty-four of those, because its
  // winners advance out of the stage rather than within it, and picking one of
  // them lands you at an arbitrary corner of round four.
  return kept.length ? [kept.reduce((a, b) => (key(b) > key(a) ? b : a)).match_number] : [];
}

// Lays the bracket out. This is the expensive one — Mermaid is about five
// milliseconds a node — so it runs only when the bracket itself changes: a new
// event, a stage, a stage cut, a flow direction, or fresh scores. Choosing a
// player or a country does not come through here at all; see applySelection.
//
// quiet is the auto-refresh: redraw in place. Recentring is right when you have
// just chosen something and intolerable every sixty seconds, and replacing the
// SVG can shift the page under a reader even without it.
async function render(quiet) {
  if (!state.rows.length) return;
  const hold = quiet ? { x: window.scrollX, y: window.scrollY } : null;
  const t0 = performance.now();
  const d = buildDiagram(state.rows, state.dir, state.fromStage);
  const tBuild = performance.now() - t0;
  state.diagram = d;
  $('counts').textContent = countsLine();

  try {
    // The sixty-second refresh redraws whether or not anything moved, and a
    // full stage 1 is about two seconds of layout — so a bracket nobody is
    // playing on costs two seconds a minute for as long as the tab is open.
    //
    // It does not have to. The source string carries every fact a node shows:
    // the names, the scores, the winner's gold, the table, the scheduled time,
    // and the identifier of whatever an empty slot is waiting on. Nothing about
    // the picture is decided anywhere else — the selection is painted on
    // afterwards, and the live ring is a class. So a byte-identical source
    // means a diagram the reader could not tell apart, and the one already on
    // screen will do. The moment any of those facts moves, the string differs
    // and this falls through to a full render as before.
    const reuse = d.src === state.src && !!$('graph').querySelector('svg');
    let tMermaid = 0;
    if (!reuse) {
      // Mermaid measures every label in a container of its own and blocks while
      // it does, so a full stage 1 stalls the tab for a couple of seconds. Say so,
      // and give the browser two frames to actually paint the message before
      // handing it the work; otherwise the page just appears to lock up.
      if (d.nodes > 150) {
        setStatus('<span class="spinner"></span>Laying out ' + d.nodes + ' matches…');
        await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
      }
      const t1 = performance.now();
      const { svg } = await mermaid.render('bracket-' + Date.now(), d.src);
      tMermaid = performance.now() - t1;
      $('graph').innerHTML = svg;
      state.src = d.src;
      applyZoom();               // the diagram is new; the zoom is the reader's
    }
    setStatus('');
    // Straight away rather than on the next frame, so there is never a painted
    // frame without the selection on it. getBBox/getCTM force the layout they
    // need, so the numbers are real already.
    const t2 = performance.now();
    applySelection(currentSel(), { centre: !quiet });
    const tSel = performance.now() - t2;
    console.log('[graph] %d nodes, %d links (%d drawn, %d ghost) · build %sms, mermaid %s, select %sms',
      d.nodes, d.cost.links, d.cost.drawn, d.cost.ghosts,
      tBuild.toFixed(0), reuse ? 'reused' : tMermaid.toFixed(0) + 'ms', tSel.toFixed(0));
    requestAnimationFrame(() => {
      // Second chance: the first pass runs before the SVG has been through a
      // layout, and on a cold render the boxes can still measure as nothing.
      applySelection(currentSel(), { centre: !quiet && !hold });
      if (hold) window.scrollTo(hold.x, hold.y);
    });
  } catch (err) {
    // Source is no longer shown on the page, so put it where it is still
    // reachable when a render fails.
    console.error('Mermaid render failed\n', err, '\n--- source ---\n', d.src);
    setStatus('Mermaid failed to render: ' + err.message + ' (source logged to console)', true);
  }
}

function syncButtons() {
  document.querySelectorAll('[data-dir]').forEach(b =>
    b.classList.toggle('active', b.dataset.dir === state.dir));
}

function safeDecode(s) { try { return decodeURIComponent(s); } catch (e) { return s; } }

// A full URL from either site names its own source. A bare slug keeps whichever
// source is loaded, since there is nothing in a slug to tell them apart.
function parseTarget(raw) {
  const s = (raw || '').trim();
  let m = s.match(/wntlivescores\.com\/events\/([^/?#]+)/i);
  if (m) return { source: 'wnt', slug: safeDecode(m[1]) };
  m = s.match(/digitalpool\.com\/tournaments\/([^/?#]+)/i);
  if (m) return { source: 'digitalpool', slug: safeDecode(m[1]) };
  return { source: state.source, slug: s.replace(/^\/+|\/+$/g, '') };
}

// Snap a name from the URL onto the bracket's exact spelling, or drop it —
// highlighting matches on an exact name, so a near miss would silently
// highlight nothing and look like a bug. A country code has to be one this
// stage actually fields, for the same reason.
function resolveSelection() {
  if (state.player) {
    const hit = state.playerBy.get(state.player.toLowerCase());
    state.player = hit ? hit.name : null;
  }
  if (state.country && !state.countries.some(c => c.code === state.country)) {
    state.country = null;
  }
  // Match numbers mean something different in every event and in every WNT
  // stage, so a route carried in from the address bar has to name a match this
  // bracket actually holds.
  if (state.waiting && !(state.index && state.index.byNum[state.waiting])) {
    state.waiting = null;
  }
  const sel = currentSel();
  // A link may name a player the `from` in the same link hides; move the cut
  // rather than drop the selection.
  ensureVisible(sel);
  pickPlayerUI(sel);
}

// The search box is transient now, so what is lit is reported by the counts
// line and by the clear button riding above the magnifier — the box itself no
// longer carries the selection, since it is only on screen while you type.
function pickPlayerUI(sel) {
  const clear = $('search-clear');
  clear.hidden = !sel;
  clear.title = sel ? 'Clear the highlight on ' + sel.label : '';
  $('search-fab').classList.toggle('visible', state.rows.length > 0);
  // Shown above the results so the overlay says what is lit while you retype.
  const hint = $('search-hint');
  hint.hidden = !sel;
  hint.textContent = sel ? 'Highlighted: ' + sel.label : '';
}

function openSearch() {
  if (!state.rows.length) return;
  $('search-overlay').classList.add('open');
  $('player-input').value = '';
  renderResults();
  $('player-input').focus();
}

function closeSearch() {
  $('search-overlay').classList.remove('open');
  $('player-input').blur();
}

function syncUrl() {
  const wnt = state.source === 'wnt';
  const url = new URL(location);
  url.searchParams.delete(wnt ? 'digitalpool' : 'wnt');
  url.searchParams.set(wnt ? 'wnt' : 'digitalpool', state.slug);
  if (wnt && state.stage) url.searchParams.set('stage', String(state.stage));
  else url.searchParams.delete('stage');
  if (state.fromStage > 0) url.searchParams.set('from', String(state.fromStage));
  else url.searchParams.delete('from');
  // Mutually exclusive, so at most one of these is ever written. ?country=tw is
  // the same parameter index.html shares its country filter under.
  if (state.player) url.searchParams.set('player', state.player);
  else url.searchParams.delete('player');
  if (state.country) url.searchParams.set('country', state.country);
  else url.searchParams.delete('country');
  if (state.waiting) url.searchParams.set('waiting', String(state.waiting));
  else url.searchParams.delete('waiting');
  history.replaceState(null, '', url);
}

// Nothing to steer once a load has failed: the controls would still be offering
// the last event's stages and rounds, and the Stage picker would happily redraw
// its bracket under the new slug in the address bar.
function clearLoaded() {
  stopRefresh();
  setRows([]);
  state.diagram = null;
  // The SVG goes below, so the source it was laid out from must go with it —
  // otherwise the next load of the same bracket would match against a diagram
  // that is no longer on the page and skip the render that puts it back.
  state.src = null;
  $('sel-style').textContent = '';
  state.wntData = null;
  state.tournament = null;
  populateStages([]);
  $('from-group').hidden = true;
  $('round-from').innerHTML = '<option value="0">All stages</option>';
  $('round-from').classList.remove('filtered');
  $('counts').textContent = '';
  $('graph').innerHTML = '';
  // Nothing to search either, so the magnifier goes with it.
  closeSearch();
  pickPlayerUI(null);
  // The tab and the back link named the tournament that is no longer on screen.
  document.title = 'PoolRadar — Bracket Graph';
  $('back-link').href = 'index.html';
  $('back-link').textContent = '← PoolRadar';
}

// A WNT event is a slow fetch — the proxy walks it stage by stage — so a second
// Load pressed while the first is still out is entirely normal, and without
// this the slower response would land last and draw its bracket under the newer
// slug. Only the newest load is allowed to commit anything.
let loadSeq = 0;

async function load(source, slug) {
  if (!slug) {
    setStatus('Paste a digitalpool.com or wntlivescores.com URL above, or add ' +
      '<code>?digitalpool=&lt;slug&gt;</code> or <code>?wnt=&lt;slug&gt;</code> to this one.');
    return;
  }
  const seq = ++loadSeq;
  state.source = source === 'wnt' ? 'wnt' : 'digitalpool';
  state.slug = slug;
  $('slug-input').value = slug;
  setStatus('<span class="spinner"></span>Loading ' + esc(slug) + '…');
  $('graph').innerHTML = '';
  try {
    const t0 = performance.now();
    let loaded;
    if (state.source === 'wnt') {
      const event = await fetchWnt(slug);
      if (seq !== loadSeq) return;
      state.wntData = event;
      const stages = wntStages(state.wntData);
      if (!stages.length) {
        clearLoaded();
        setStatus('No matches published yet for "' + esc(slug) + '".', true);
        return;
      }
      // Open on the furthest stage the event has actually reached — that is
      // where the tournament is. Stage 1 is a 400-match wall you go back for on
      // purpose, and a stage whose draw is published but empty is worse still.
      const pool = stages.filter(s => s.reached);
      const open = (pool.length ? pool : stages).slice(-1)[0].stage;
      if (!stages.some(s => s.stage === state.stage)) state.stage = open;
      populateStages(stages);
      setRows(wntRows(state.wntData, state.stage));
      state.tournament = { name: state.wntData.name || slug };
      loaded = 'stage ' + state.stage + ', ' + state.rows.length + ' matches';
    } else {
      state.wntData = null;
      state.stage = 0;
      populateStages([]);
      const data = await gql(QUERY, { s: slug });
      if (seq !== loadSeq) return;
      setRows(data.tournament_brackets || []);
      state.tournament = (data.tournaments || [])[0] || null;
      loaded = state.rows.length + ' bracket rows';
    }
    if (!state.rows.length) {
      clearLoaded();
      setStatus('No bracket found for "' + esc(slug) + '".', true);
      return;
    }
    const name = state.tournament ? state.tournament.name : slug;
    document.title = name + ' — Bracket Graph';
    $('back-link').href = 'index.html?' + (state.source === 'wnt' ? 'wnt=' : 'digitalpool=') +
      encodeURIComponent(slug);
    $('back-link').textContent = '← ' + name;
    setStatus('Loaded ' + loaded + ' in ' + Math.round(performance.now() - t0) + ' ms');
    populateRounds(state.rows);
    resolveSelection();
    syncUrl();
    await render();
    startRefresh();
  } catch (err) {
    if (seq !== loadSeq) return;      // a newer load owns the page now
    clearLoaded();
    setStatus('Failed to load: ' + esc(err.message), true);
  }
}

// =====================================================
// Zoom — the diagram only, not the page
// =====================================================
// A CSS transform on #graph rather than re-rendering at another font size:
// scaling what is already laid out is instant and keeps every node in the same
// relative place, where a re-layout would reflow the whole bracket. It also
// means the floor is far below the 10px the diagram is built at — the text is
// vector, so shrinking it is just scaling, not re-measuring.
//
// A transform leaves layout size alone, so #zoom is sized to the scaled
// footprint; that is what the page actually scrolls over.
const ZOOM_MIN = 0.15, ZOOM_MAX = 4;
let zoom = 1;

function applyZoom() {
  const g = $('graph');
  // offsetWidth ignores transforms, so this is always the unscaled footprint
  // however far in or out we currently are.
  const w = g.offsetWidth, h = g.offsetHeight;
  g.style.transform = zoom === 1 ? '' : 'scale(' + zoom + ')';
  const z = $('zoom');
  z.style.width = w ? Math.round(w * zoom) + 'px' : '';
  z.style.height = h ? Math.round(h * zoom) + 'px' : '';
  const btn = $('zoom-reset');
  btn.hidden = zoom === 1;
  btn.textContent = Math.round(zoom * 100) + '%';
}

// Zoom about a point, keeping whatever is under it under it. Without this the
// diagram slides away from the cursor and you chase it.
function zoomAt(next, cx, cy) {
  next = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, next));
  if (Math.abs(next - zoom) < 0.0005) return;
  const g = $('graph');
  const before = g.getBoundingClientRect();
  const gx = (cx - before.left) / zoom;      // the anchor, in unscaled units
  const gy = (cy - before.top) / zoom;
  zoom = next;
  applyZoom();
  const after = g.getBoundingClientRect();
  window.scrollBy(after.left + gx * zoom - cx, after.top + gy * zoom - cy);
}

// ctrl/cmd + wheel is the desktop convention, and a trackpad pinch arrives as
// exactly that. A plain wheel is left alone so the page still scrolls.
$('viewport').addEventListener('wheel', (e) => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  zoomAt(zoom * Math.exp(-e.deltaY / 300), e.clientX, e.clientY);
}, { passive: false });

const pinchSpan = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
let pinch = null;
$('viewport').addEventListener('touchstart', (e) => {
  if (e.touches.length !== 2) { pinch = null; return; }
  pinch = { span: pinchSpan(e.touches) || 1, zoom };
}, { passive: true });
$('viewport').addEventListener('touchmove', (e) => {
  if (!pinch || e.touches.length !== 2) return;
  e.preventDefault();
  zoomAt(pinch.zoom * pinchSpan(e.touches) / pinch.span,
    (e.touches[0].clientX + e.touches[1].clientX) / 2,
    (e.touches[0].clientY + e.touches[1].clientY) / 2);
}, { passive: false });
for (const ev of ['touchend', 'touchcancel']) {
  $('viewport').addEventListener(ev, () => { pinch = null; });
}
$('zoom-reset').addEventListener('click', () => {
  zoom = 1;
  applyZoom();
});

// =====================================================
// Auto-refresh — the same sixty seconds index.html runs on
// =====================================================
// A bracket with nothing left to play will never change again, so the timer
// stops rather than reloading a finished draw once a minute. That is per stage:
// sitting on the US Open's completed stage 1 is as static as a finished event,
// even while stage 2 is being played.
const REFRESH_INTERVAL = 60;
let refreshTimer = null, lastRefresh = 0;

const stillRunning = () => state.rows.some(r => !r.is_bye && r.status !== 'COMPLETED');

function showCountdown(secs) {
  $('refresh').hidden = !refreshTimer;
  $('countdown').textContent = String(secs);
}

function stopRefresh() {
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
  $('refresh').hidden = true;
}

function startRefresh() {
  stopRefresh();
  if (!state.slug || !stillRunning()) return;
  lastRefresh = Date.now();
  refreshTimer = setInterval(tickRefresh, 1000);
  showCountdown(REFRESH_INTERVAL);
}

function tickRefresh() {
  const left = REFRESH_INTERVAL - (Date.now() - lastRefresh) / 1000;
  // Not under an open search: the overlay hides the diagram anyway, and
  // rebuilding the rows under a list someone is arrowing through is rude.
  // lastRefresh is left alone, so it fires as soon as the overlay closes.
  if (left <= 0 && !$('search-overlay').classList.contains('open')) {
    showCountdown(REFRESH_INTERVAL);
    refreshData();
    return;
  }
  showCountdown(Math.max(1, Math.round(left)));
}

// Refetches the loaded target and redraws in place. Everything the reader has
// set — stage, cut, selection, flow, scroll — is left exactly as it was; only
// the scores and statuses move.
async function refreshData() {
  if (!state.slug) return;
  const seq = ++loadSeq;
  lastRefresh = Date.now();
  try {
    let rows, tournament;
    if (state.source === 'wnt') {
      const event = await fetchWnt(state.slug);
      if (seq !== loadSeq) return;
      const stages = wntStages(event);
      if (!stages.length) return;
      state.wntData = event;
      // A stage can appear mid-event; keep the one being read unless it is gone.
      if (!stages.some(s => s.stage === state.stage)) return;
      populateStages(stages);
      rows = wntRows(event, state.stage);
      tournament = { name: event.name || state.slug };
    } else {
      const data = await gql(QUERY, { s: state.slug });
      if (seq !== loadSeq) return;
      rows = data.tournament_brackets || [];
      tournament = (data.tournaments || [])[0] || state.tournament;
    }
    if (!rows.length) return;
    setRows(rows);
    state.tournament = tournament;
    populateRounds(state.rows);
    resolveSelection();
    await render(true);
    if (!stillRunning()) stopRefresh();
  } catch (err) {
    // Silent: the next tick tries again, and a transient proxy hiccup should
    // not replace a good diagram with an error.
    console.warn('Auto-refresh failed, will retry:', err);
  }
}

// A backgrounded tab throttles timers, so coming back can be well past due.
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !refreshTimer) return;
  if ((Date.now() - lastRefresh) / 1000 >= REFRESH_INTERVAL) {
    showCountdown(REFRESH_INTERVAL);
    refreshData();
  } else {
    tickRefresh();
  }
});

document.querySelectorAll('[data-dir]').forEach(b => b.addEventListener('click', () => {
  state.dir = b.dataset.dir; syncButtons(); render();
}));
$('round-from').addEventListener('change', (e) => {
  state.fromStage = parseInt(e.target.value, 10) || 0;
  e.target.classList.toggle('filtered', state.fromStage > 0);
  // Deliberately no ensureVisible here — choosing a cut by hand should stick,
  // even one that hides the selected player.
  syncUrl();
  render();
});
// A WNT stage is a bracket of its own, already in hand — no refetch, and the
// round cut is dropped because its stage numbers mean something else here.
// resolveSelection keeps the selection if it survives into the new stage,
// which the 64 who came through stage 1, and their countries, all do.
$('stage-sel').addEventListener('change', (e) => {
  state.stage = parseInt(e.target.value, 10) || 0;
  state.fromStage = 0;
  setRows(wntRows(state.wntData, state.stage));
  populateRounds(state.rows);
  resolveSelection();
  syncUrl();
  render();
  startRefresh();
});
$('search-fab').addEventListener('click', openSearch);
$('search-close').addEventListener('click', closeSearch);
$('search-clear').addEventListener('click', () => select(null, null));
// Only the backdrop closes; a click inside the box is aimed at something.
$('search-overlay').addEventListener('click', (e) => {
  if (e.target === $('search-overlay')) closeSearch();
});
$('player-input').addEventListener('input', renderResults);
$('player-input').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); moveCursor(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); moveCursor(-1); }
  else if (e.key === 'Enter') {
    e.preventDefault();
    if (searchCursor >= 0) activateEntry(searchHits[searchCursor]);
  } else if (e.key === 'Escape') {
    closeSearch();
  }
});
// click, not mousedown — the list is its own panel now, so there is no blur
// racing to close it out from under the pointer.
$('player-list').addEventListener('click', (e) => {
  const item = e.target.closest('.pse-item');
  if (!item) return;
  if (item.dataset.country) select(null, item.dataset.country);
  else select(item.dataset.name, null);
});

// One delegated listener, attached once — only #graph's contents are replaced
// on re-render, never the element itself. Element.closest walks out of the
// label's foreignObject into the SVG, so both lookups work from one event.
$('graph').addEventListener('click', (e) => {
  const node = e.target.closest('g.node');
  const m = node && (node.id || '').match(/[^A-Za-z0-9]M(\d+)(?![0-9])/);
  if (!m) return;
  const num = +m[1];
  // A name is a claim about one player, so it means that player.
  const span = e.target.closest('.pn1, .pn2');
  if (span) {
    const row = state.rows.find(r => r.match_number === num);
    const c = row && (span.classList.contains('pn1') ? row.challenger1 : row.challenger2);
    if (c && c.name) {
      select(state.player === c.name ? null : c.name, null);   // click again to clear
      return;
    }
  }
  // The number column and an empty slot are both about the match rather than
  // about anyone in it, and what a match is waiting on is the only question it
  // can answer on its own. Asked here rather than precomputed per node, because
  // it is only ever asked of the one box that was actually clicked — the whole
  // point of aiming at a target instead of at the box.
  if (!e.target.closest('.nd-h, .nt-id, .pnd')) return;
  if (!state.index || !owedTo(state.index, num).length) return;
  select(null, null, state.waiting === num ? null : num);      // click again to clear
});
document.addEventListener('keydown', (e) => {
  // Escape closes the overlay from anywhere, including a click that moved focus
  // off the input without closing it.
  if (e.key === 'Escape' && $('search-overlay').classList.contains('open')) {
    closeSearch();
    return;
  }
  // Same guard as index.html — "/" is a normal character while typing.
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key !== '/' || !state.rows.length) return;
  e.preventDefault();
  openSearch();
});
// A hand-typed target is a different event unless it is the same one again, and
// stage numbers mean nothing across events — drop it and let the load open on
// the new event's latest. Retyping the current slug to refresh keeps the stage.
const loadTyped = () => {
  const t = parseTarget($('slug-input').value);
  if (t.source !== state.source || t.slug !== state.slug) state.stage = 0;
  load(t.source, t.slug);
};
$('load-btn').addEventListener('click', loadTyped);
$('slug-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') loadTyped(); });

syncButtons();
const params = new URLSearchParams(location.search);
state.fromStage = Math.max(0, parseInt(params.get('from') || '0', 10) || 0);
state.player = params.get('player') || null;
state.country = (params.get('country') || '').toLowerCase() || null;
state.stage = Math.max(0, parseInt(params.get('stage') || '0', 10) || 0);
state.waiting = Math.max(0, parseInt(params.get('waiting') || '0', 10) || 0) || null;
const wntSlug = params.get('wnt');
state.source = wntSlug ? 'wnt' : 'digitalpool';
const initial = wntSlug || params.get('digitalpool') || '';
$('slug-input').value = initial;
// bracket-algo.js is this page's one dependency and it arrives as a plain
// script, so nothing checks that it turned up. A browser holding an old copy of
// it — which is easy to arrange, since a static server that sends no
// Cache-Control leaves the freshness lifetime to the browser's imagination —
// surfaces as "buildBracketIndex is not defined" thrown from inside a load,
// naming neither the file nor the reason. Say it plainly instead.
if (typeof buildBracketIndex !== 'function') {
  setStatus('bracket-algo.js did not load, or the browser is holding an old copy. ' +
    'Hard-reload the page (Cmd/Ctrl + Shift + R).', true);
} else {
  load(state.source, initial);
}
</script>
</body>
</html>

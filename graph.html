<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- minimum-scale under 1 is what lets a pinch go below the default zoom; no
     maximum-scale so zooming in keeps the browser's own generous ceiling. -->
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=0.2">
<title>PoolRadar &mdash; Bracket Graph</title>
<style>
* { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; font-size: 14px; }
a { color: #60a5fa; text-decoration: none; }
a:hover { text-decoration: underline; }

.header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #1e293b; border-bottom: 1px solid #334155; flex-wrap: wrap; }
.header h1 { margin: 0; font-size: 18px; color: #f8fafc; flex-shrink: 0; }
.header .sub { color: #64748b; font-size: 12px; }
.url-input { flex: 1; min-width: 180px; max-width: 420px; padding: 7px 12px; border: 1px solid #475569; border-radius: 6px; background: #0f172a; color: #e2e8f0; font-size: 14px; font-family: inherit; }

.toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: #1e293b; border-bottom: 1px solid #334155; flex-wrap: wrap; }
.toggle-btn { background: #0f172a; border: 1px solid #475569; color: #94a3b8; border-radius: 6px; padding: 5px 11px; cursor: pointer; font-size: 12px; font-family: inherit; }
.toggle-btn:hover { border-color: #64748b; color: #e2e8f0; }
.toggle-btn.active { background: #1d4ed8; border-color: #3b82f6; color: #f8fafc; }
.tb-group { display: flex; gap: 4px; align-items: center; }
.select-input { background: #0f172a; border: 1px solid #475569; color: #94a3b8; border-radius: 6px; padding: 5px 8px; font-size: 12px; font-family: inherit; cursor: pointer; }
.select-input:hover { border-color: #64748b; color: #e2e8f0; }
.select-input.filtered { border-color: #3b82f6; color: #dbeafe; }
.tb-label { color: #64748b; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-right: 2px; }
.spacer { flex: 1; }

.psearch { position: relative; display: flex; align-items: center; gap: 4px; }
.psearch input { width: 190px; background: #0f172a; border: 1px solid #475569; color: #e2e8f0; border-radius: 6px;
  padding: 5px 24px 5px 26px; font-size: 12px; font-family: inherit; outline: none; }
.psearch input:focus { border-color: #3b82f6; }
.pse-icon { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 12px; height: 12px;
  color: #64748b; pointer-events: none; }
.psearch:hover .pse-icon, .psearch:focus-within .pse-icon { color: #94a3b8; }
.pse-kbd { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); color: #475569;
  font: 10px/1 'SF Mono', Menlo, Consolas, monospace; border: 1px solid #334155; border-radius: 3px;
  padding: 2px 4px; pointer-events: none; }
.psearch input:focus ~ .pse-kbd, .psearch input.picked ~ .pse-kbd { display: none; }
.psearch input.picked { border-color: #60a5fa; color: #dbeafe; }
.pse-list { position: absolute; top: 100%; left: 0; margin-top: 4px; z-index: 60; min-width: 290px; max-height: 300px;
  overflow-y: auto; background: #1e293b; border: 1px solid #475569; border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5); display: none; }
.pse-list.open { display: block; }
.pse-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; cursor: pointer; color: #e2e8f0; font-size: 13px; }
.pse-item.active, .pse-item:hover { background: #334155; }
.pse-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pse-name mark { background: none; color: #60a5fa; font-weight: 700; }
/* Monospace so the runs line up down the list and are scannable as a column */
.pse-meta { margin-left: auto; padding-left: 10px; flex-shrink: 0; white-space: nowrap;
  font: 11px/1 'SF Mono', Menlo, Consolas, monospace; letter-spacing: 1px; }
.pse-meta .fw { color: #4ade80; }
.pse-meta .fl { color: #f87171; }
.pse-empty { padding: 12px 10px; color: #64748b; font-size: 12px; }

.legend { display: flex; gap: 14px; padding: 8px 16px; background: #0f172a; border-bottom: 1px solid #334155; font-size: 11px; color: #64748b; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.swatch { width: 11px; height: 11px; border-radius: 3px; border: 1px solid; display: inline-block; }
.lg-win { color: #fbbf24; }
.lg-lose { color: #f87171; }
.lg-drop { color: #64748b; font-size: 10px; }
.solid { width: 18px; border-top: 2px solid #64748b; display: inline-block; }

#status { padding: 12px 16px; font-size: 13px; color: #94a3b8; }
#status.error { color: #fca5a5; }
.spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid #334155; border-top-color: #60a5fa; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* The graph overflows the page rather than sitting in its own scroll box: a
   device-width scroll container would clip at the same place however far you
   pinched out, so zooming out would shrink everything and reveal nothing. */
#viewport { padding: 16px; touch-action: pan-x pan-y pinch-zoom; }
#graph { display: inline-block; }
/* Full-bleed bars, so they still span when scrolled right past device width */
.header, .toolbar, .legend, #status { min-width: max-content; }
#graph svg { max-width: none !important; }
/* Mermaid renders labels as HTML in a foreignObject, so the tags inside a
   node label are stylable from here: <b> the match winner, <i> a slot still
   waiting on a feeder, <small> the loser's drop destination. classDef sets
   colour on the label, hence !important. */
#graph b { color: #fbbf24 !important; font-weight: 400; }
#graph i { color: #64748b !important; font-style: italic; }
/* relative, so it tracks themeVariables.fontSize instead of fighting it */
#graph small { color: #64748b !important; font-size: 0.85em; }
#graph em { color: #f87171 !important; font-style: normal; }
#graph .pn1, #graph .pn2 { cursor: pointer; }
#graph .pn1:hover, #graph .pn2:hover { text-decoration: underline; }

@media (max-width: 768px) {
  .header h1 { font-size: 16px; }
  .url-input { max-width: none; flex-basis: 100%; }
}
</style>
</head>
<body>

<div class="header">
  <h1>Bracket Graph</h1>
  <input class="url-input" id="slug-input" placeholder="tournament slug or digitalpool.com URL">
  <button class="toggle-btn" id="load-btn">Load</button>
  <span class="spacer"></span>
  <a id="back-link" href="index.html">&larr; PoolRadar</a>
</div>

<div class="toolbar">
  <span class="tb-group"><span class="tb-label">From</span>
    <select class="select-input" id="round-from"><option value="0">All stages</option></select>
  </span>
  <span class="tb-group"><span class="tb-label">Player</span>
    <span class="psearch" title="Highlight a player (/)">
      <svg class="pse-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.7-4.7"/></svg>
      <input type="text" id="player-input" placeholder="Highlight a player…" autocomplete="off"
             autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Highlight a player (press / to focus)">
      <kbd class="pse-kbd">/</kbd>
      <div class="pse-list" id="player-list" role="listbox"></div>
    </span>
    <button class="toggle-btn" id="player-clear" hidden>&times;</button>
  </span>
  <span class="tb-group"><span class="tb-label">Flow</span>
    <button class="toggle-btn" data-dir="TB">&darr;</button>
    <button class="toggle-btn" data-dir="LR">&rarr;</button>
  </span>
  <span class="spacer"></span>
  <span class="sub" id="counts"></span>
</div>

<div class="legend">
  <span><b class="lg-win">Gold</b> = won the match</span>
  <span><span class="lg-lose">Red</span> = highlighted player lost this one</span>
  <span><i class="solid"></i> winner advances</span>
  <span><span class="lg-drop">(L to L4-4)</span> = where this match sends its loser</span>
  <span>click a name to highlight that player &middot; click again to clear</span>
</div>

<div id="status"></div>
<div id="viewport"><div id="graph"></div></div>

<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

const GQL = 'https://api-cached.digitalpool.com/';

mermaid.initialize({
  startOnLoad: false,
  theme: 'dark',
  // Node width is the measured label plus padding, and the label is measured
  // at this size — so halving it roughly halves the boxes. This is the knob to
  // turn if they want to be bigger or smaller; nothing else scales them.
  themeVariables: { fontSize: '8px' },
  securityLevel: 'strict',
  // A full double-elim bracket is ~126 nodes / ~250 edges, well past the defaults.
  maxTextSize: 500000,
  maxEdges: 2000,
  // useMaxWidth:false is the important one — left on, Mermaid emits a
  // responsive SVG that scales to the container, so the more rounds are shown
  // the smaller every box gets. Off, nodes keep a constant readable size and
  // the page scrolls instead.
  flowchart: { curve: 'basis', nodeSpacing: 22, rankSpacing: 60, padding: 6, useMaxWidth: false },
});

const QUERY = `query($s:String!){
  tournaments(where:{slug:{_eq:$s}},limit:1){name status}
  tournament_brackets(where:{tournament:{slug:{_eq:$s}}},order_by:{match_number:asc}){
    match_number round identifier status is_bye
    challenger1{name skill_level} challenger2{name skill_level}
    challenger1_score challenger2_score
    challenger1_is_winner challenger2_is_winner
    winner_to_num loser_to_num
  }
}`;

const $ = (id) => document.getElementById(id);
const state = { dir: 'TB', fromStage: 0, player: null, rows: [], tournament: null };

function setStatus(msg, isError) {
  const el = $('status');
  el.className = isError ? 'error' : '';
  el.innerHTML = msg;
}

async function gql(query, variables) {
  const res = await fetch(GQL, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ query, variables }),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if (json.errors) throw new Error(json.errors.map(e => e.message).join('; '));
  return json.data;
}

const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Mermaid treats these as syntax even inside a quoted label.
function mmEsc(s) {
  return String(s)
    .replace(/#/g, '#35;')
    .replace(/"/g, '#quot;')
    .replace(/[\[\]{}()<>|]/g, (c) => '#' + c.charCodeAt(0) + ';');
}

// First name where unique in the field, else first name + last initial.
function buildShortNames(rows) {
  const byFirst = new Map();
  for (const r of rows) {
    for (const c of [r.challenger1, r.challenger2]) {
      if (!c) continue;
      const first = c.name.trim().split(/\s+/)[0];
      if (!byFirst.has(first)) byFirst.set(first, new Set());
      byFirst.get(first).add(c.name);
    }
  }
  const out = new Map();
  for (const r of rows) {
    for (const c of [r.challenger1, r.challenger2]) {
      if (!c || out.has(c.name)) continue;
      const parts = c.name.trim().split(/\s+/);
      const first = parts[0], last = parts[parts.length - 1];
      const shared = byFirst.get(first).size > 1;
      out.set(c.name, shared && last !== first ? `${first} ${last.charAt(0)}.` : first);
    }
  }
  return out;
}

function nodeLabel(r, short, feeders, dropTo, player) {
  // In a selected player's matches both sides get their full name and rating —
  // that is the detail you want when following one player, and the shortened
  // form is only there to keep the general view narrow.
  const spotlight = player && playerIn(r, player);
  const decided = !!(r.challenger1_is_winner || r.challenger2_is_winner);
  // An empty slot is waiting on a specific match, so name it rather than
  // printing TBD twice. Feeders that already have a winner have delivered
  // their player, so only undecided ones can correspond to an empty slot.
  const pending = (feeders.get(r.match_number) || [])
    .filter(f => !f.src.challenger1_is_winner && !f.src.challenger2_is_winner);
  let fi = 0;
  // slot is 1 or 2 — the wrapper is what lets a delegated click tell which of
  // the two players in a node was clicked.
  const line = (c, score, won, slot) => {
    if (!c) {
      const f = pending[fi++];
      if (!f) return '<i>TBD</i>';
      return '<i>' + f.kind + ' of ' + mmEsc(f.src.identifier || ('#' + f.src.match_number)) + '</i>';
    }
    const nm = mmEsc(spotlight
      ? c.name + (c.skill_level ? ' (' + c.skill_level + ')' : '')
      : (short.get(c.name) || c.name));
    const sc = score == null ? '' : ' ' + score;
    // In a spotlighted match only the selected player is coloured — gold won,
    // red lost — so their run reads at a glance. The opponent stays default
    // even when they won, so the two can never be confused.
    let body = nm;
    if (spotlight) {
      const mine = c.name === player;
      if (mine && won) body = '<b>' + nm + '</b>';
      else if (mine && decided) body = '<em>' + nm + '</em>';
    } else if (won) {
      body = '<b>' + nm + '</b>';
    }
    // Single-quoted attribute: the label itself is delimited by double quotes,
    // which is why mmEsc strips them from the text in the first place.
    return "<span class='pn" + slot + "'>" + body + '</span>' + sc;
  };
  const parts = [
    mmEsc(r.identifier || ('#' + r.match_number)),
    line(r.challenger1, r.challenger1_score, r.challenger1_is_winner, 1),
    line(r.challenger2, r.challenger2_score, r.challenger2_is_winner, 2),
  ];
  // Where the loser drops, as a footnote on the match itself rather than a
  // separate node with an edge into it.
  // Parens go through mmEsc like everything else — they are escaped in every
  // other label, and a bare "(" is exactly what Mermaid's parser trips on.
  if (dropTo) parts.push('<small>' + mmEsc('(L to ' + dropTo + ')') + '</small>');
  return parts.join('<br/>');
}

// A stage is the pair named by a winners match's two outgoing edges: W3-1 goes
// to W4-1 or drops to L4-4, so W4 and L4 belong together. That gives
// W2/L1, W3/L2, W4/L4, W5/L6, W6/L8, W7/L10 — Wk with L(2k-4), and W2/L1 as
// the exception since there is no L0. W1 stands alone; nothing has dropped yet.
//
// The minor losers rounds (L3, L5, L7, L9) take no drop-downs, so no winners
// round names them. They stay on their own, ordered on the half step between
// the pairs that bracket them: L3 sits at 3.5, between W3/L2 and W4/L4.
//
// The returned number doubles as the group key — rounds sharing a stage share
// a value, and every stage has a distinct one.
function stageOf(round) {
  if (round == null) return 0;
  if (round > 0) return round;
  const n = Math.abs(round);
  if (n === 1) return 2;
  if (n % 2 === 0) return n / 2 + 2;
  return (n - 1) / 2 + 2.5;
}

// The rounds a stage contains, e.g. 4 -> ['W4','L4']. Derived from
// stageOf so the dropdown can never disagree with the grouping.
function stageRounds(stage, haveW, haveL) {
  const out = [];
  if (haveW.has(stage)) out.push('W' + stage);
  for (const n of [...haveL].sort((a, b) => a - b)) {
    if (stageOf(-n) === stage) out.push('L' + n);
  }
  return out;
}

const playerIn = (r, name) =>
  (r.challenger1 && r.challenger1.name === name) ||
  (r.challenger2 && r.challenger2.name === name);

// Which matches survive the stage cut. Shared with the player search so the
// dropdown and the diagram can never disagree about what is on screen.
function keptMatches(rows, fromStage) {
  const byNum = new Map(rows.map(r => [r.match_number, r]));
  const keep = new Set(rows.filter(r => !r.is_bye).map(r => r.match_number));
  if (!(fromStage > 0)) return keep;
  // Keep whole stages, so picking W4 brings L5/L6 rather than L4 — L4 belongs
  // to stage 3 and would otherwise dangle without its winners round.
  for (const n of Array.from(keep)) {
    const r = byNum.get(n);
    if (r && r.round != null && stageOf(r.round) < fromStage) keep.delete(n);
  }
  // The deep losers rounds outrank the final (L10 vs W7), so a cut past the
  // winners depth would drop it. Every option says "→ final", so honour that.
  for (const r of rows) {
    if (!r.is_bye && r.winner_to_num == null) keep.add(r.match_number);
  }
  return keep;
}

function buildDiagram(rows, dir, fromStage, player) {
  const byNum = new Map(rows.map(r => [r.match_number, r]));
  const short = buildShortNames(rows);
  const keep = keptMatches(rows, fromStage);

  // Hop over byes so an edge lands on a real match.
  const hop = (n) => {
    for (let i = 0; i < 10 && n; i++) {
      const d = byNum.get(n);
      if (!d) return null;
      if (!d.is_bye) return d.match_number;
      n = d.winner_to_num;
    }
    return null;
  };

  // Which matches feed each match, for naming empty slots. Built over all rows
  // regardless of the stage cut, so a kept match still names an off-graph feeder.
  const feeders = new Map();
  for (const r of rows) {
    if (r.is_bye) continue;
    for (const [dest, kind] of [[r.winner_to_num, 'W'], [r.loser_to_num, 'L']]) {
      const d = hop(dest);
      if (!d) continue;
      if (!feeders.has(d)) feeders.set(d, []);
      feeders.get(d).push({ src: r, kind });
    }
  }

  // Where each winners match sends its loser, from round 2 on. Rendered as a
  // footnote inside the match box, so no drop edge and no stub node is needed.
  // Not limited to kept matches — the text is useful even when the stage cut
  // puts the destination off-graph.
  const dropTo = new Map();
  for (const r of rows) {
    if (r.is_bye || !(r.round >= 2)) continue;
    const d = hop(r.loser_to_num);
    const dr = d != null ? byNum.get(d) : null;
    if (dr) dropTo.set(r.match_number, dr.identifier || ('#' + dr.match_number));
  }

  // Only winner progression is drawn now. Drops live in the labels above, and
  // round 1 draws nothing at all — it fans out across the whole of W2 and L1,
  // which is noise. It still needs a rank though: dagre ranks nodes, not
  // clusters, so leaving those edgeless stacks them into a column.
  const edges = [];
  for (const r of rows) {
    if (!keep.has(r.match_number) || r.round === 1) continue;
    for (const [dest, kind] of [[r.winner_to_num, 'W'], [r.loser_to_num, 'L']]) {
      if (kind === 'L' && r.round > 0) continue; // shown as a label footnote
      const d = hop(dest);
      if (!d || !keep.has(d)) continue;
      edges.push({ from: r, to: byNum.get(d), kind });
    }
  }

  // So give it one invisible link per match, matched one-to-one rather than to
  // both real destinations: the first half of W1 pins W2, the second half pins
  // L1. This is what puts the winners side on the left — dagre orders each rank
  // to minimise crossings, so whichever round the left half of W1 points at
  // ends up on the left, regardless of the order the subgraphs were emitted in.
  // Every round-1 node lands on the same rank as a row, both destination
  // rounds sit on the rank below, and there is no many-to-many for dagre to
  // untangle. Pairing is positional, not by actual progression — nothing is
  // drawn, so it only has to hold the layout.
  const asc = (a, b) => a.match_number - b.match_number;
  const r1 = [], r2 = [], rl1 = [];
  for (const r of rows) {
    if (r.is_bye || !keep.has(r.match_number)) continue;
    if (r.round === 1) r1.push(r);
    else if (r.round === 2) r2.push(r);
    else if (r.round === -1) rl1.push(r);
  }
  r1.sort(asc); r2.sort(asc); rl1.sort(asc);
  const ghosts = [];
  if (r1.length && r1.length === r2.length + rl1.length) {
    r2.forEach((m, i) => ghosts.push([r1[i], m]));
    rl1.forEach((m, j) => ghosts.push([r1[r2.length + j], m]));
  } else {
    // Byes or a non-standard bracket break the halves; fall back to each
    // match's own destinations so no round-1 node is left unranked.
    for (const r of r1) {
      for (const dest of [r.winner_to_num, r.loser_to_num]) {
        const d = hop(dest);
        if (d && keep.has(d)) ghosts.push([r, byNum.get(d)]);
      }
    }
  }

  const lines = [`flowchart ${dir}`];
  const kept = rows.filter(r => keep.has(r.match_number));


  const sgIds = [], stageIds = [];
  const byRound = new Map();
  for (const r of kept) {
    const k = r.round == null ? 0 : r.round;
    if (!byRound.has(k)) byRound.set(k, []);
    byRound.get(k).push(r);
  }
  const allRounds = [...byRound.keys()];
  // Round subgraphs nest inside a stage wrapper; within a stage the winners
  // round leads, then its two losers rounds in order.
  const byStage = new Map();
  for (const k of allRounds) {
    const st = stageOf(k);
    if (!byStage.has(st)) byStage.set(st, []);
    byStage.get(st).push(k);
  }
  // Winners round leads, losers round follows, so the winners side sits left.
  // Only a hint though — the round-1 ghost split below is what actually decides
  // left/right, because dagre orders a rank to minimise crossings.
  for (const list of byStage.values()) {
    list.sort((a, b) => (a > 0 ? -1 : 0) - (b > 0 ? -1 : 0) || Math.abs(a) - Math.abs(b));
  }

  for (const st of [...byStage.keys()].sort((a, b) => a - b)) {
    const inStage = byStage.get(st);
    // Only a genuine pair gets the extra layer. A minor losers round is alone
    // in its stage, so wrapping it would add nesting that groups nothing.
    // Blank title + no stroke/fill: the wrapper exists to constrain layout,
    // not to draw a labelled box. Halved ids keep 3.5 out of the identifier.
    const wrap = inStage.length > 1;
    if (wrap) {
      const stId = 'ST' + Math.round(st * 2);
      stageIds.push(stId);
      lines.push(`  subgraph ${stId}[" "]`);
    }
    const pad = wrap ? '    ' : '  ';
    for (const k of inStage) {
      const id = k === 0 ? 'Rx' : 'R' + (k > 0 ? 'W' : 'L') + Math.abs(k);
      const label = k === 0 ? 'Unranked' : (k > 0 ? 'Winners R' + k : 'Losers R' + Math.abs(k));
      sgIds.push(id);
      lines.push(`${pad}subgraph ${id}["${label}"]`);
      for (const r of byRound.get(k) || []) lines.push(`${pad}  M${r.match_number}["${nodeLabel(r, short, feeders, dropTo.get(r.match_number), player)}"]`);
      lines.push(`${pad}end`);
    }
    if (wrap) lines.push('  end');
  }

  // Links are collected before emission because linkStyle addresses them by
  // position, so the order has to be fixed before any index is handed out.
  const links = [];
  for (const [a, b] of ghosts) links.push({ from: a.match_number, to: b.match_number, ghost: true });
  for (const e of edges) links.push({ from: e.from.match_number, to: e.to.match_number });

  // A selected player's real progression, which includes the two steps drawn
  // for nobody else: out of round 1, and the drop across to the losers side.
  const hiNodes = new Set();
  const path = [];
  if (player) {
    for (const r of rows) {
      if (r.is_bye || !playerIn(r, player) || !keep.has(r.match_number)) continue;
      hiNodes.add(r.match_number);
      const c1 = r.challenger1 && r.challenger1.name === player;
      const won = (c1 && r.challenger1_is_winner) || (!c1 && r.challenger2_is_winner);
      const decided = r.challenger1_is_winner || r.challenger2_is_winner;
      if (!decided) continue;
      const next = hop(won ? r.winner_to_num : r.loser_to_num);
      if (next != null && keep.has(next)) path.push([r.match_number, next]);
    }
  }
  // A ghost on the path is promoted to a real edge — styling cannot make `~~~`
  // visible. An edge already drawn is marked in place rather than duplicated.
  for (const [a, b] of path) {
    const at = links.findIndex(l => l.from === a && l.to === b);
    if (at >= 0) { links[at].ghost = false; links[at].hi = true; }
    else links.push({ from: a, to: b, hi: true });
  }

  // hiPairs is the player's chain as node-id pairs, which is all the renderer
  // needs to find those paths again in the SVG. Collected here rather than
  // re-derived later, where the match numbers would have to be parsed back out.
  const hiIdx = [], faintIdx = [], hiPairs = [];
  links.forEach((l, i) => {
    lines.push(`  M${l.from} ${l.ghost ? '~~~' : '-->'} M${l.to}`);
    if (l.ghost) return;              // never style an invisible link
    (l.hi ? hiIdx : faintIdx).push(i);
    if (l.hi) hiPairs.push([l.from, l.to]);
  });

  // One uniform look for every match — status is no longer encoded in colour.
  const plain = kept.filter(r => !hiNodes.has(r.match_number));
  lines.push('  classDef match fill:#1e293b,stroke:#475569,color:#cbd5e1');
  if (plain.length) lines.push(`  class ${plain.map(r => 'M' + r.match_number).join(',')} match`);
  if (hiNodes.size) {
    lines.push('  classDef hilite fill:#1e3a5f,stroke:#60a5fa,stroke-width:2px,color:#e2e8f0');
    lines.push(`  class ${[...hiNodes].map(n => 'M' + n).join(',')} hilite`);
  }
  // Indices are listed explicitly rather than using `linkStyle default`, which
  // would also hit the invisible links and make them show up.
  if (player && hiIdx.length) {
    if (faintIdx.length) lines.push(`  linkStyle ${faintIdx.join(',')} stroke:#1e293b,stroke-width:1px`);
    lines.push(`  linkStyle ${hiIdx.join(',')} stroke:#60a5fa,stroke-width:3px`);
  }
  for (const id of sgIds) lines.push(`  style ${id} fill:none,stroke:#334155,color:#64748b`);
  for (const id of stageIds) lines.push(`  style ${id} fill:none,stroke:none`);

  // Where the player enters the visible bracket — earliest stage wins, so it
  // works whichever side that is, and it follows the cut rather than assuming
  // round 1 is on screen. Match number only breaks ties within a stage.
  let focus = null;
  for (const n of hiNodes) {
    const st = stageOf(byNum.get(n).round);
    if (!focus || st < focus.st || (st === focus.st && n < focus.n)) focus = { n, st };
  }

  return { src: lines.join('\n'), nodes: keep.size, hits: hiNodes.size, focus: focus && focus.n, hiPairs };
}

// ---------------------------------------------------------------------------
// Player search — same ranking as index.html: prefix matches rank above
// mid-word ones, and every token has to match somewhere.
// ---------------------------------------------------------------------------
const SEARCH_CAP = 12;
let searchHits = [], searchCursor = -1;

// Every player is listed and every one is selectable — the stage cut moves to
// them rather than the other way round, so there is nothing to grey out.
function collectPlayers(rows) {
  const byName = new Map();
  for (const r of rows) {
    for (const c of [r.challenger1, r.challenger2]) {
      if (!c || !c.name) continue;
      const k = c.name.toLowerCase();
      if (!byName.has(k)) byName.set(k, { name: c.name, results: [] });
      if (r.is_bye) continue;
      if (!(r.challenger1_is_winner || r.challenger2_is_winner)) continue;
      const c1 = r.challenger1 && r.challenger1.name === c.name;
      const won = (c1 && r.challenger1_is_winner) || (!c1 && r.challenger2_is_winner);
      // Stage first, then match number: match numbers alone are not
      // chronological across the two sides (W2 is 33-48 but L1 is 49-64).
      byName.get(k).results.push({ key: stageOf(r.round) * 1000 + r.match_number, won });
    }
  }
  for (const e of byName.values()) {
    e.results.sort((a, b) => a.key - b.key);
    e.form = e.results.map(x => (x.won ? 'W' : 'L'));
    e.won = e.form.filter(x => x === 'W').length;
    e.played = e.form.length;
  }
  return [...byName.values()];
}

function reEsc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function rankPlayers(query) {
  const players = collectPlayers(state.rows);
  const toks = query.toLowerCase().trim().split(/\s+/).filter(Boolean);
  if (!toks.length) return players.sort((a, b) => a.name.localeCompare(b.name));
  const scored = [];
  for (const p of players) {
    const lname = p.name.toLowerCase();
    const words = lname.split(/\s+/);
    let score = 0, ok = true;
    for (const tk of toks) {
      if (lname.indexOf(tk) === 0) continue;
      if (words.some(w => w.indexOf(tk) === 0)) { score += 1; continue; }
      if (lname.indexOf(tk) !== -1) { score += 3; continue; }
      ok = false;
      break;
    }
    if (ok) scored.push({ p, score });
  }
  scored.sort((a, b) => a.score - b.score || a.p.name.localeCompare(b.p.name));
  return scored.map(s => s.p);
}

function highlightName(name, toks) {
  if (!toks.length) return esc(name);
  const parts = name.split(new RegExp('(' + toks.map(reEsc).join('|') + ')', 'ig'));
  return parts.map((p, i) => (i % 2 === 1 ? '<mark>' + esc(p) + '</mark>' : esc(p))).join('');
}

function renderResults() {
  const list = $('player-list');
  if (!state.rows.length) { list.classList.remove('open'); return; }
  const query = $('player-input').value;
  const toks = query.toLowerCase().trim().split(/\s+/).filter(Boolean);
  const all = rankPlayers(query);
  searchHits = all.slice(0, SEARCH_CAP);
  searchCursor = searchHits.length ? 0 : -1;
  if (!searchHits.length) {
    list.innerHTML = '<div class="pse-empty">No player matches &ldquo;' + esc(query) + '&rdquo;</div>';
  } else {
    searchCursor = 0;
    list.innerHTML = searchHits.map((p, i) =>
      '<div class="pse-item' + (i === 0 ? ' active' : '') +
      '" role="option" data-name="' + esc(p.name) + '">' +
      '<span class="pse-name">' + highlightName(p.name, toks) + '</span>' +
      '<span class="pse-meta">' + p.form.map(ch =>
        '<span class="f' + ch.toLowerCase() + '">' + ch + '</span>').join('') +
      '</span></div>').join('') +
      (all.length > searchHits.length
        ? '<div class="pse-empty">Showing ' + searchHits.length + ' of ' + all.length + '</div>' : '');
  }
  list.classList.add('open');
}

function moveCursor(delta) {
  if (!searchHits.length) return;
  const items = $('player-list').querySelectorAll('.pse-item');
  if (searchCursor >= 0 && items[searchCursor]) items[searchCursor].classList.remove('active');
  searchCursor = (searchCursor + delta + searchHits.length) % searchHits.length;
  const el = items[searchCursor];
  if (el) { el.classList.add('active'); el.scrollIntoView({ block: 'nearest' }); }
}

// If the current cut hides every one of this player's matches, widen it until
// it doesn't. The stage holding their last loss is the target: that is the
// match that ended their run, and the one you want to land on. Players still
// in the running have no loss to aim at, so their last match is used instead.
function ensureVisible(name) {
  const keep = keptMatches(state.rows, state.fromStage);
  const mine = state.rows.filter(r => !r.is_bye && playerIn(r, name));
  if (!mine.length || mine.some(r => keep.has(r.match_number))) return;

  const lost = mine.filter(r => {
    if (!(r.challenger1_is_winner || r.challenger2_is_winner)) return false;
    const c1 = r.challenger1 && r.challenger1.name === name;
    return !((c1 && r.challenger1_is_winner) || (!c1 && r.challenger2_is_winner));
  });
  const key = (r) => stageOf(r.round) * 1000 + r.match_number;
  const target = (lost.length ? lost : mine).reduce((a, b) => (key(b) > key(a) ? b : a));

  // Options are whole winners-anchored stages, so round down: a match at stage
  // 3.5 is kept by the stage-3 cut, since the cut keeps everything at or past it.
  const want = Math.floor(stageOf(target.round));
  const sel = $('round-from');
  const pick = want >= 2 && sel.querySelector('option[value="' + want + '"]') ? want : 0;
  state.fromStage = pick;
  sel.value = String(pick);
  sel.classList.toggle('filtered', pick > 0);
}

function pickPlayer(name) {
  state.player = name || null;
  if (state.player) ensureVisible(state.player);
  pickPlayerUI(state.player);
  syncUrl(parseSlug($('slug-input').value));
  render();
}

// Options are stages, built from the rounds the bracket actually has, so each
// entry names exactly what it keeps: "W4 / L5-L6 → final".
function populateRounds(rows) {
  const w = new Set(), l = new Set();
  for (const r of rows) {
    if (r.is_bye || r.round == null) continue;
    (r.round > 0 ? w : l).add(Math.abs(r.round));
  }
  // Cut points are the winners-anchored stages; a minor losers round sits on a
  // half step and makes no sense as a "from here to the end" boundary.
  const maxStage = Math.max(0, ...w);
  const sel = $('round-from');
  sel.innerHTML = '<option value="0">All stages</option>';
  for (let s = 2; s <= maxStage; s++) {
    const parts = stageRounds(s, w, l);
    if (!parts.length) continue;
    const wPart = parts.filter(p => p[0] === 'W');
    const lPart = parts.filter(p => p[0] === 'L');
    const label = [wPart.join(''), lPart.join('-')].filter(Boolean).join(' / ');
    const o = document.createElement('option');
    o.value = String(s);
    o.textContent = label + ' → final';
    sel.appendChild(o);
  }
  if (state.fromStage > maxStage) state.fromStage = 0;
  sel.value = String(state.fromStage);
  sel.classList.toggle('filtered', state.fromStage > 0);
}

// Mermaid ids its node groups "flowchart-<id>-<n>". Match on a boundary so M1
// does not also hit M10 or M12.
function findNodeEl(mid) {
  const re = new RegExp('(^|[^A-Za-z0-9])' + mid + '([^0-9]|$)');
  for (const g of $('graph').querySelectorAll('g.node')) {
    if (re.test(g.id || '')) return g;
  }
  return null;
}

// ---------------------------------------------------------------------------
// The highlighted player's edges, redrawn after Mermaid has rendered
//
// Mermaid itself is untouched: it parses and lays the diagram out exactly as
// before, we drop its SVG into the page, and then we overwrite the `d` string
// of the handful of paths that make up the selected player's run. No hook, no
// fork, no custom renderer — the same kind of edit as setting a style on an
// element after load. Every faint edge keeps the spline Mermaid gave it, so
// the diagram around the player is pixel-for-pixel what it always was.
//
// Each highlighted edge becomes the same cubic. Its two control points sit
// directly under the start point and directly over the end point, sharing one
// coordinate between the two ranks — the "lane". A cubic leaves P0 heading at
// P1 and arrives at P3 coming from P2, so that placement alone makes the edge
// exit square out of the source's bottom face and enter square into the
// destination's top face:
//
//        ┌──────┐
//        └──┬───┘   P0 = source's bottom face
//           ●───────────────●        P1 and P2, both on the lane
//                           │
//                      ┌────▼──┐
//                      └───────┘   P3 = destination's top face
//
// The arrowhead is a marker-end declared orient="auto", which is a plain SVG
// feature: the browser re-aims the marker along whatever path it is attached
// to. So nothing below touches an arrow.
//
// In LR the whole construction is transposed — right face to left face.
// ---------------------------------------------------------------------------

// Mermaid's pointEnd marker is 8 user units wide with its reference point in
// the middle, so its tip overhangs the path's last point by 4. Stopping that
// far short puts the tip on the border instead of inside the box.
const ARROWHEAD = 4;

// Mermaid names an edge path after the two nodes it joins ("L_M107_M113_0",
// carried on the path as data-id), and repeats a node's own id inside its
// group id ("…-flowchart-M107-42"). Those two are the whole interface.
const EDGE_ID = /^L_(M\d+)_(M\d+)_\d+$/;
const NODE_ID = /(?:^|[^A-Za-z0-9])(M\d+)(?![0-9])/;

// getBBox measures in the element's own coordinates and leaves the element's
// own transform out; getCTM includes that transform and every one above it. So
// the node's CTM composed with the inverse of the edge layer's puts the node's
// box in exactly the user space the paths' `d` strings are written in.
function boxInPathSpace(el, inv) {
  const b = el.getBBox();
  const m = inv.multiply(el.getCTM());
  const xs = [], ys = [];
  for (const p of [[b.x, b.y], [b.x + b.width, b.y],
                   [b.x, b.y + b.height], [b.x + b.width, b.y + b.height]]) {
    xs.push(m.a * p[0] + m.c * p[1] + m.e);
    ys.push(m.b * p[0] + m.d * p[1] + m.f);
  }
  return { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) };
}

const bez = (t, p0, p1, p2, p3) => {
  const u = 1 - t;
  return u * u * u * p0 + 3 * u * u * t * p1 + 3 * u * t * t * p2 + t * t * t * p3;
};

// How many sample points of a candidate curve land inside some other node's
// box. Edges paint under nodes, so a route straight through a rank disappears
// into it — this is the number the lane search minimises.
function buried(sx, sy, dx, dy, lane, vert, boxes) {
  let hit = 0;
  for (let j = 1; j < 40; j++) {
    const t = j / 40;
    const x = vert ? bez(t, sx, sx, dx, dx) : bez(t, sx, lane, lane, dx);
    const y = vert ? bez(t, sy, lane, lane, dy) : bez(t, sy, sy, dy, dy);
    for (const b of boxes) {
      if (x >= b.x0 && x <= b.x1 && y >= b.y0 && y <= b.y1) { hit++; break; }
    }
  }
  return hit;
}

// pairs is buildDiagram's hiPairs — the selected player's chain, as [from, to]
// match numbers. Returns how many edges were redrawn, or -1 if it could not run.
function reroutePath(pairs, dir) {
  if (!pairs || !pairs.length) return -1;      // no player selected: a real no-op
  try {
    const root = $('graph');
    const want = new Set(pairs.map(([a, b]) => 'M' + a + '|M' + b));
    const paths = [];
    for (const p of root.querySelectorAll('path[data-id]')) {
      const m = (p.getAttribute('data-id') || '').match(EDGE_ID);
      if (m && want.has(m[1] + '|' + m[2])) paths.push({ p, a: m[1], b: m[2] });
    }
    if (!paths.length) return -1;

    // Every edge path is a direct child of the same <g>, with no transform of
    // its own, so one inverse serves all of them.
    const ctm = paths[0].p.getCTM();
    if (!ctm) return -1;
    const inv = ctm.inverse();

    const box = new Map();
    for (const g of root.querySelectorAll('g.node')) {
      const m = (g.id || '').match(NODE_ID);
      if (m) box.set(m[1], boxInPathSpace(g, inv));
    }

    const vert = dir !== 'LR' && dir !== 'RL';
    const face = (bx) => vert ? bx.x1 - bx.x0 : bx.y1 - bx.y0;
    // The player's run is a chain, so a node carries at most one highlighted
    // edge per face and there is nothing to spread out. But the faint feeder
    // Mermaid drew into that same face is still there and still lands near the
    // middle, so shift off centre towards the other end — two arrowheads on one
    // spot read as a single broken arrow.
    const nudge = (size, towards) => Math.sign(towards) * Math.min(size * 0.3, 14);

    // Only needed by the lane search; most chains contain at most one edge
    // that travels far enough sideways to want it.
    let allBoxes = null;

    const n = (v) => Math.round(v * 100) / 100;
    let done = 0;

    for (const { p, a, b } of paths) {
      const S = box.get(a), D = box.get(b);
      if (!S || !D) continue;                  // an id we cannot place: leave it alone
      const scx = (S.x0 + S.x1) / 2, scy = (S.y0 + S.y1) / 2;
      const dcx = (D.x0 + D.x1) / 2, dcy = (D.y0 + D.y1) / 2;
      let sx, sy, dx, dy, lo, hi;
      if (vert) {
        sx = scx + nudge(S.x1 - S.x0, dcx - scx);
        dx = dcx + nudge(D.x1 - D.x0, scx - dcx);
        sy = S.y1; dy = D.y0 - ARROWHEAD;
        lo = sy; hi = dy;
      } else {
        sy = scy + nudge(S.y1 - S.y0, dcy - scy);
        dy = dcy + nudge(D.y1 - D.y0, scy - dcy);
        sx = S.x1; dx = D.x0 - ARROWHEAD;
        lo = sx; hi = dx;
      }
      // Not comfortably downstream — a same-rank or backwards edge is not the
      // case this was written for, so leave Mermaid's own path in place.
      if (![sx, sy, dx, dy].every(Number.isFinite) || !(hi - lo > 8)) continue;

      // A near-vertical edge — every winners→winners and losers→losers hop —
      // can only run through the empty gutter between two ranks, so the
      // midpoint lane is always right and there is nothing to search for. The
      // drop across to the losers side crosses a whole row of boxes and would
      // vanish behind them, so for that one, try 19 lanes and keep the least
      // buried. Ties go to the midpoint, the symmetric S you want when clear.
      let lane = (lo + hi) / 2;
      const travel = Math.abs(vert ? dx - sx : dy - sy);
      if (travel > 3 * face(S)) {
        if (!allBoxes) allBoxes = [...box.values()];
        const near = allBoxes.filter(bx => bx !== S && bx !== D &&
          bx.x1 >= Math.min(sx, dx) - 2 && bx.x0 <= Math.max(sx, dx) + 2 &&
          bx.y1 >= Math.min(sy, dy) - 2 && bx.y0 <= Math.max(sy, dy) + 2);
        let best = null;
        for (let i = 1; i <= 19; i++) {
          const f = i / 20, cand = lo + (hi - lo) * f;
          const hitN = buried(sx, sy, dx, dy, cand, vert, near);
          const off = Math.abs(f - 0.5);
          if (!best || hitN < best.hit || (hitN === best.hit && off < best.off)) best = { cand, hit: hitN, off };
        }
        if (best) lane = best.cand;
      }

      p.setAttribute('d', vert
        ? `M${n(sx)},${n(sy)} C${n(sx)},${n(lane)} ${n(dx)},${n(lane)} ${n(dx)},${n(dy)}`
        : `M${n(sx)},${n(sy)} C${n(lane)},${n(sy)} ${n(lane)},${n(dy)} ${n(dx)},${n(dy)}`);
      done++;
    }
    return done;
  } catch (err) {
    // A selector or a coordinate space that moved under us is not worth losing
    // the graph over: Mermaid's own paths are still there, detours and all.
    console.warn('Highlighted edges left as Mermaid routed them:', err);
    return -1;
  }
}

// The page is the only scroll container now, on both axes.
function centerOn(el) {
  const er = el.getBoundingClientRect();
  const x = er.left + window.scrollX + er.width / 2 - window.innerWidth / 2;
  const y = er.top + window.scrollY + er.height / 2 - window.innerHeight / 2;
  window.scrollTo({ left: Math.max(0, x), top: Math.max(0, y), behavior: 'smooth' });
}

async function render() {
  if (!state.rows.length) return;
  const { src, nodes, hits, focus, hiPairs } = buildDiagram(state.rows, state.dir, state.fromStage, state.player);

  const total = state.rows.filter(r => !r.is_bye).length;
  const live = state.rows.filter(r => r.status === 'IN_PROGRESS').length;
  const left = state.rows.filter(r => !r.is_bye && r.status !== 'COMPLETED').length;
  $('counts').textContent = state.player
    ? `${state.player}: ${hits} match${hits === 1 ? '' : 'es'} shown of ${nodes}`
    : `${nodes} of ${total} matches · ${left} left · ${live} in progress`;

  try {
    const { svg } = await mermaid.render('bracket-' + Date.now(), src);
    $('graph').innerHTML = svg;
    setStatus('');
    // Straight away rather than on the next frame, so there is never a painted
    // frame with the old splines on screen. getBBox/getCTM force the layout
    // they need, so the numbers are real already.
    const t0 = performance.now();
    const routed = reroutePath(hiPairs, state.dir);
    if (routed > 0) console.log('[reroute] %d edges in %s ms', routed, (performance.now() - t0).toFixed(1));
    // After a frame, so the SVG has been laid out and the rects are real.
    requestAnimationFrame(() => {
      // Second chance only if there was something to do and it could not measure.
      if (routed < 0 && hiPairs.length) reroutePath(hiPairs, state.dir);
      if (focus != null) {
        const el = findNodeEl('M' + focus);
        if (el) centerOn(el);
      }
    });
  } catch (err) {
    // Source is no longer shown on the page, so put it where it is still
    // reachable when a render fails.
    console.error('Mermaid render failed\n', err, '\n--- source ---\n', src);
    setStatus('Mermaid failed to render: ' + err.message + ' (source logged to console)', true);
  }
}

function syncButtons() {
  document.querySelectorAll('[data-dir]').forEach(b =>
    b.classList.toggle('active', b.dataset.dir === state.dir));
}

function parseSlug(raw) {
  const s = (raw || '').trim();
  const m = s.match(/digitalpool\.com\/tournaments\/([^/?#]+)/);
  return m ? m[1] : s.replace(/^\/+|\/+$/g, '');
}

// Snap a name from the URL onto the bracket's exact spelling, or drop it —
// highlighting matches on an exact name, so a near miss would silently
// highlight nothing and look like a bug.
function resolvePlayer() {
  if (!state.player) { pickPlayerUI(null); return; }
  const want = state.player.toLowerCase();
  const hit = collectPlayers(state.rows).find(p => p.name.toLowerCase() === want);
  state.player = hit ? hit.name : null;
  // A link may name a player the `from` in the same link hides; move the cut
  // rather than drop the selection.
  if (state.player) ensureVisible(state.player);
  pickPlayerUI(state.player);
}

function pickPlayerUI(name) {
  $('player-input').value = name || '';
  $('player-input').classList.toggle('picked', !!name);
  $('player-clear').hidden = !name;
  $('player-list').classList.remove('open');
}

function syncUrl(slug) {
  const url = new URL(location);
  url.searchParams.set('digitalpool', slug);
  if (state.fromStage > 0) url.searchParams.set('from', String(state.fromStage));
  else url.searchParams.delete('from');
  if (state.player) url.searchParams.set('player', state.player);
  else url.searchParams.delete('player');
  history.replaceState(null, '', url);
}

async function load(slug) {
  if (!slug) { setStatus('Enter a tournament slug above, or add <code>?digitalpool=&lt;slug&gt;</code> to the URL.'); return; }
  setStatus('<span class="spinner"></span>Loading ' + slug + '…');
  $('graph').innerHTML = '';
  try {
    const t0 = performance.now();
    const data = await gql(QUERY, { s: slug });
    state.rows = data.tournament_brackets || [];
    state.tournament = (data.tournaments || [])[0] || null;
    if (!state.rows.length) { setStatus('No bracket found for "' + slug + '".', true); return; }
    const name = state.tournament ? state.tournament.name : slug;
    document.title = name + ' — Bracket Graph';
    $('back-link').href = 'index.html?digitalpool=' + encodeURIComponent(slug);
    $('back-link').textContent = '← ' + name;
    setStatus('Loaded ' + state.rows.length + ' bracket rows in ' + Math.round(performance.now() - t0) + ' ms');
    populateRounds(state.rows);
    resolvePlayer();
    syncUrl(slug);
    await render();
  } catch (err) {
    setStatus('Failed to load: ' + err.message, true);
  }
}

document.querySelectorAll('[data-dir]').forEach(b => b.addEventListener('click', () => {
  state.dir = b.dataset.dir; syncButtons(); render();
}));
$('round-from').addEventListener('change', (e) => {
  state.fromStage = parseInt(e.target.value, 10) || 0;
  e.target.classList.toggle('filtered', state.fromStage > 0);
  // Deliberately no ensureVisible here — choosing a cut by hand should stick,
  // even one that hides the selected player.
  syncUrl(parseSlug($('slug-input').value));
  render();
});
$('player-input').addEventListener('input', renderResults);
$('player-input').addEventListener('focus', renderResults);
$('player-input').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); moveCursor(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); moveCursor(-1); }
  else if (e.key === 'Enter') {
    e.preventDefault();
    const hit = searchCursor >= 0 ? searchHits[searchCursor] : null;
    if (hit) pickPlayer(hit.name);
  } else if (e.key === 'Escape') {
    $('player-list').classList.remove('open');
    $('player-input').blur();
  }
});
$('player-list').addEventListener('mousedown', (e) => {
  // mousedown, not click — the input's blur would close the list first.
  const item = e.target.closest('.pse-item');
  if (!item) return;
  e.preventDefault();
  pickPlayer(item.dataset.name);
});
$('player-clear').addEventListener('click', () => pickPlayer(null));

// One delegated listener, attached once — only #graph's contents are replaced
// on re-render, never the element itself. Element.closest walks out of the
// label's foreignObject into the SVG, so both lookups work from one event.
$('graph').addEventListener('click', (e) => {
  const span = e.target.closest('.pn1, .pn2');
  if (!span) return;
  const node = span.closest('g.node');
  const m = node && (node.id || '').match(/[^A-Za-z0-9]M(\d+)(?![0-9])/);
  if (!m) return;
  const row = state.rows.find(r => r.match_number === +m[1]);
  if (!row) return;
  const c = span.classList.contains('pn1') ? row.challenger1 : row.challenger2;
  if (!c || !c.name) return;
  pickPlayer(state.player === c.name ? null : c.name);   // click again to clear
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.psearch')) $('player-list').classList.remove('open');
});
document.addEventListener('keydown', (e) => {
  // Same guard as index.html — "/" is a normal character while typing.
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key !== '/' || !state.rows.length) return;
  e.preventDefault();
  const input = $('player-input');
  input.focus();
  input.select();
  renderResults();
});
$('load-btn').addEventListener('click', () => load(parseSlug($('slug-input').value)));
$('slug-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') load(parseSlug($('slug-input').value));
});

syncButtons();
const params = new URLSearchParams(location.search);
state.fromStage = Math.max(0, parseInt(params.get('from') || '0', 10) || 0);
state.player = params.get('player') || null;
const initial = params.get('digitalpool') || '';
$('slug-input').value = initial;
load(initial);
</script>
</body>
</html>
